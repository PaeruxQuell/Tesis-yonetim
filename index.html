<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tesis Yönetim Sistemi</title>
<link rel="stylesheet" href="stil.css?v=14">
</head>
<body>

<!-- ================= FIREBASE SDK ================= -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<!-- ================= GİRİŞ EKRANI ================= -->
<div id="girisEkrani" style="height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);">
  <div class="girisKart">
    <div class="girisLogo">⌁</div>
    <div class="girisBaslik">Giriş yap</div>
    <div class="girisAlt">Tesis Yönetim Sistemi</div>

    <label class="girisAlan">E-posta</label>
    <input class="girisInput" id="girisEposta" type="email" autocomplete="username" />

    <label class="girisAlan">Şifre</label>
    <input class="girisInput" id="girisSifre" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter'){event.preventDefault();girisGonder();}" />

    <button class="girisBtn ty-btn" id="girisButonu" onclick="girisGonder()">Giriş yap</button>
    <div class="girisHata" id="girisHataMetni"></div>
  </div>
</div>

<!-- ================= UYGULAMA ================= -->
<div id="uygulama" style="display:none;">
  <div class="ustCubuk">
    <div style="display:flex;align-items:center;gap:18px;min-width:0;flex:1">
      <div id="logoAlani" class="logoAlani ty-btn" onclick="anaSayfaGoster()" title="Ana Sayfa"></div>
      <div id="ustNav" class="ustNav"></div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;flex-shrink:0">
      <button class="lambaBtn ty-btn" id="lambaBtn" onclick="lambaTikla()" title="Temayı değiştir">
        <span id="lambaIkon">💡</span>
        <span id="lambaMetin">Koyu Tema</span>
      </button>
      <span class="kullaniciRozeti" id="kullaniciRozeti"></span>
      <div style="position:relative">
        <button class="canBtn ty-btn" id="canBtn" onclick="bildirimPaneliAcKapat()" title="Bildirimler">
          <span class="canIkonu" id="canIkonu">🔔</span>
          <span class="canRozet" id="canRozet" style="display:none">0</span>
        </button>
        <div id="bildirimPaneli" class="bildirimPaneli" style="display:none"></div>
      </div>
      <button class="ustBtn ty-btn" onclick="ayarlarGoster()">⚙ Ayarlar</button>
      <button class="ustBtn ty-btn" onclick="cikisYap()">Çıkış yap</button>
    </div>
  </div>
  <div id="ustMarquee"></div>
  <div class="govde">
    <div class="sol" id="solMenu"></div>
    <div class="ana" id="anaPanel"></div>
    <div class="sag" id="sagMenu"></div>
  </div>
</div>
<datalist id="malzemeListesi"></datalist>

<div id="toastKapsayici" class="toastKapsayici"></div>

<div id="teyitModal" class="modalOverlay" style="display:none">
  <div class="modalKutu">
    <div class="modalBaslik" id="teyitBaslik"></div>
    <div class="modalMetin" id="teyitMetin"></div>
    <div class="modalSoru" id="teyitSoru"></div>
    <input class="girdi" id="teyitGirdi" type="number" placeholder="Cevap" onkeydown="if(event.key==='Enter'){event.preventDefault();teyitOnayla();}" />
    <div class="modalHata" id="teyitHata"></div>
    <div class="modalBtnSatir">
      <button class="ustBtn ty-btn" onclick="teyitIptal()">Vazgeç</button>
      <button class="eklePrimer ty-btn" id="teyitOnayBtn" onclick="teyitOnayla()">Onayla</button>
    </div>
  </div>
</div>

<script src="cekirdek.js?v=14"></script>
<script src="stok.js?v=14"></script>
<script src="anasayfa.js?v=14"></script>
<script src="ayarlar.js?v=14"></script>
<script src="bakim.js?v=14"></script>
<script src="pompa.js?v=14"></script>
<script src="rapor.js?v=14"></script>
<script src="raporlar.js?v=14"></script>
<script src="satinalma.js?v=14"></script>
<script src="baslangic.js?v=14"></script>
</body>
</html>
