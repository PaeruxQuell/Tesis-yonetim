<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tesis Yönetim Sistemi</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'IBM Plex Sans', sans-serif; background: #0e1116; color: #e6edf3; }
  input, textarea, select, button { font-family: 'IBM Plex Sans', sans-serif; }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: #2c3542; border-radius: 4px; }
  .ty-btn { cursor: pointer; transition: all .12s ease; }
  .ty-btn:hover { filter: brightness(1.15); }
  .ty-node:hover { background: #1b212b; }
  .ty-satir:hover { background: #1b212b !important; }

  #girisEkrani {
    height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0e1116;
  }
  .girisKart {
    width: 340px; background: #12161d; border: 1px solid #1f2630; border-radius: 12px;
    padding: 28px 26px;
  }
  .girisLogo { font-size: 26px; color: #e2a33d; margin-bottom: 4px; }
  .girisBaslik { font-size: 16px; font-weight: 600; margin-bottom: 2px; }
  .girisAlt { font-size: 12px; color: #5b6579; margin-bottom: 20px; }
  .girisAlan { display: block; font-size: 11.5px; color: #8996a8; margin: 12px 0 5px; }
  .girisInput {
    width: 100%; background: #0e1116; border: 1px solid #2a323f; border-radius: 6px;
    color: #e6edf3; padding: 9px 10px; font-size: 13.5px; outline: none;
  }
  .girisInput:focus { border-color: #e2a33d; }
  .girisBtn {
    width: 100%; margin-top: 18px; background: #e2a33d; color: #1a1305; border: none;
    border-radius: 6px; padding: 10px; font-size: 13.5px; font-weight: 600;
  }
  .girisLink { display: block; text-align: center; margin-top: 14px; font-size: 12px; color: #5b8fe2; cursor: pointer; }
  .girisHata { color: #d9603f; font-size: 12px; margin-top: 10px; min-height: 14px; }
  .kullaniciRozeti { font-size: 12px; color: #8996a8; margin-right: 6px; }

  #uygulama { display: none; flex-direction: column; height: 100vh; }
  .ustCubuk {
    display: flex; align-items: center; justify-content: space-between; padding: 12px 20px;
    border-bottom: 1px solid #1f2630; background: #12161d; flex-shrink: 0;
  }
  .logo { font-size: 20px; color: #e2a33d; }
  .baslik { font-size: 15px; font-weight: 600; letter-spacing: 0.2px; }
  .altBaslik { font-size: 11.5px; color: #5b6579; margin-top: 1px; }
  .altBaslik2 { font-size: 12.5px; color: #8996a8; margin-top: 3px; }
  .ustBtn {
    background: #181d25; color: #c7cfdb; border: 1px solid #2a323f; border-radius: 6px;
    padding: 7px 12px; font-size: 12.5px;
  }
  .govde { display: flex; flex: 1; min-height: 0; }
  .sol {
    width: 340px; border-right: 1px solid #1f2630; background: #0f1319; overflow-y: auto;
    padding: 16px 0 24px; flex-shrink: 0;
  }
  .sag {
    width: 260px; border-left: 1px solid #1f2630; background: #0f1319; overflow-y: auto;
    padding: 16px 0 24px; flex-shrink: 0;
  }
  .islemSatir { padding: 12px 16px; border-bottom: 1px solid #171c24; cursor: pointer; }
  .islemAciklama { font-size: 12.5px; color: #c7cfdb; line-height: 1.4; margin-bottom: 4px; }
  .islemZaman { font-size: 11px; color: #5b6579; font-family: 'IBM Plex Mono', monospace; }
  .satinAlmaNav {
    display: flex; justify-content: space-between; align-items: center; margin: 0 14px 20px;
    padding: 14px 16px; border-radius: 10px; border: 1px solid #232b37; background: #151b23;
    color: #dbe2ea; font-size: 15px; font-weight: 600;
  }
  .satinAlmaNav i { font-size: 18px; margin-right: 10px; }
  .satinAlmaNavAktif { border-color: #e2a33d55; background: #20293a; color: #e2a33d; }
  .rozet { background: #e2a33d; color: #12161d; font-size: 11.5px; font-weight: 700; border-radius: 10px; padding: 2px 8px; }
  .solBaslikSatir { display: flex; justify-content: space-between; align-items: center; padding: 4px 14px 10px; }
  .solBaslik { font-size: 11.5px; letter-spacing: 1px; text-transform: uppercase; color: #5b6579; font-weight: 600; }
  .ekleMini { background: #151b23; color: #e2a33d; border: 1px solid #2a323f; border-radius: 6px; font-size: 12px; padding: 5px 10px; font-weight: 500; }
  .ekleMiniMakine { background: transparent; color: #5b8fe2; border: none; font-size: 12.5px; padding: 10px 14px 10px 34px; display: block; width: 100%; text-align: left; }
  .ekleMiniPompa { background: transparent; color: #e2a33d; border: none; font-size: 12.5px; padding: 10px 14px 10px 54px; display: block; width: 100%; text-align: left; }

  .tesisKart { margin: 0 12px 14px; border: 1px solid #1f2630; border-radius: 12px; overflow: hidden; background: #12161d; }
  .tesisBaslikSatir { display: flex; align-items: center; gap: 10px; padding: 15px 14px; cursor: pointer; }
  .tesisBaslikSatir:hover { background: #161c25; }
  .tesisIkon { font-size: 19px; flex-shrink: 0; }
  .okBuyuk { font-size: 15px; color: #5b6579; transition: transform .15s; width: 12px; display: inline-block; flex-shrink: 0; }
  .tesisAdMetin, .makineAdMetin, .pompaAdMetin {
    flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer;
  }
  .tesisAdMetin { font-size: 15.5px; font-weight: 600; color: #eef2f7; }
  .makineSatir { display: flex; align-items: center; gap: 9px; padding: 13px 14px 13px 34px; cursor: pointer; border-top: 1px solid #1a2029; }
  .makineSatir:hover { background: #161c25; }
  .makineAdMetin { font-size: 14px; font-weight: 500; color: #c7cfdb; }
  .pompaSatir { display: flex; align-items: center; gap: 10px; padding: 12px 14px 12px 54px; cursor: pointer; border-top: 1px solid #171c24; border-left: 3px solid transparent; }
  .pompaSatir:hover { background: #161c25; }
  .pompaSatirSecili { background: #20293a !important; border-left: 3px solid #e2a33d; }
  .pompaAdMetin { font-size: 13.5px; color: #aab4c2; }
  .pompaSatirSecili .pompaAdMetin { color: #f0d9ae; font-weight: 500; }
  .pompaNokta { font-size: 8px; color: #3a4454; flex-shrink: 0; }
  .pompaSatirSecili .pompaNokta { color: #e2a33d; }

  .aksiyonGrup { display: flex; gap: 4px; flex-shrink: 0; }
  .aksiyonBtn {
    width: 28px; height: 28px; border-radius: 7px; display: flex; align-items: center; justify-content: center;
    color: #5b6579; font-size: 15px; cursor: pointer; border: none; background: transparent;
  }
  .aksiyonBtn:hover { background: #232b37; color: #dbe2ea; }
  .aksiyonBtnSil:hover { background: #3a1c1c; color: #e2694d; }
  .editInput {
    flex: 1; background: #0e1116; border: 1px solid #e2a33d; border-radius: 6px;
    color: #f0f3f7; font-size: 14px; padding: 5px 8px; outline: none; font-family: 'IBM Plex Sans', sans-serif;
  }
  .silIkon { color: #4a5364; font-size: 15px; cursor: pointer; padding: 0 4px; }
  .ana { flex: 1; overflow-y: auto; padding: 26px 34px 60px; }
  .bosDurum { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #5b6579; font-size: 13.5px; }
  .yolIzi { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5b6579; margin-bottom: 14px; }
  .pompaBaslikSatir { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; }
  .pompaAdBaslik { font-size: 21px; font-weight: 600; color: #f0f3f7; }
  .pompaAdInput { font-size: 21px; font-weight: 600; background: #151b23; border: 1px solid #2a323f; border-radius: 6px; color: #f0f3f7; padding: 4px 10px; }
  .duzenleBtn { background: #e2a33d; color: #1a1305; border: none; border-radius: 6px; padding: 8px 16px; font-size: 13px; font-weight: 600; }
  .duzenleBtnAktif { background: #232b37; color: #e6edf3; border: 1px solid #3a4454; border-radius: 6px; padding: 8px 16px; font-size: 13px; font-weight: 600; }
  .kart { background: #12161d; border: 1px solid #1f2630; border-radius: 10px; padding: 16px 18px; margin-bottom: 14px; }
  .kartBaslikSatir { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .kartBaslik { font-size: 12px; letter-spacing: 0.5px; text-transform: uppercase; color: #6c7789; font-weight: 500; }
  .deger { font-size: 14px; color: #dbe2ea; }
  .bosMetin { font-size: 12.5px; color: #4a5364; font-style: italic; }
  .girdi { width: 100%; background: #0e1116; border: 1px solid #2a323f; border-radius: 6px; color: #e6edf3; padding: 8px 10px; font-size: 13.5px; }
  .parcaSatir { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid #1a2029; }
  .parcaGirdi { flex: 1; background: #0e1116; border: 1px solid #2a323f; border-radius: 6px; color: #e6edf3; padding: 7px 9px; font-size: 13px; }
  .gecmisSatir { display: flex; gap: 12px; align-items: flex-start; padding: 9px 0; border-top: 1px solid #1a2029; }
  .gecmisKayit { padding: 11px 0; border-top: 1px solid #1a2029; }
  .gecmisKayit.ty-btn { cursor: pointer; }
  .gecmisUstSatir { display: flex; gap: 12px; align-items: flex-start; }
  .gecmisMalzemeListesi { margin: 10px 0 2px 112px; padding: 10px 12px; background: #0e1116; border: 1px solid #1f2630; border-radius: 8px; }
  .gecmisMalzemeSatir { display: flex; justify-content: space-between; font-size: 12.5px; color: #c7cfdb; padding: 4px 0; }
  .gecmisTarih { width: 100px; background: #0e1116; border: 1px solid #2a323f; border-radius: 6px; color: #e2a33d; padding: 7px 9px; font-size: 12px; font-family: 'IBM Plex Mono', monospace; flex-shrink: 0; }
  .gecmisTarihGoster { width: 100px; color: #e2a33d; font-size: 12px; font-family: 'IBM Plex Mono', monospace; flex-shrink: 0; padding-top: 2px; }
  .gecmisMetin { flex: 1; background: #0e1116; border: 1px solid #2a323f; border-radius: 6px; color: #e6edf3; padding: 7px 9px; font-size: 13px; }
  .saUstSatir { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
  .saArama { margin-bottom: 16px; font-size: 14px; padding: 11px 14px; }
  .filtreSatiri { display: flex; gap: 8px; margin-bottom: 16px; }
  .filtreBtn { background: #12161d; color: #8996a8; border: 1px solid #1f2630; border-radius: 8px; padding: 8px 14px; font-size: 13px; font-weight: 500; }
  .filtreBtn:hover { border-color: #3a4454; color: #dbe2ea; }
  .filtreBtnAktif { border-color: var(--filtre-renk, #e2a33d); color: var(--filtre-renk, #e2a33d); background: color-mix(in srgb, var(--filtre-renk, #e2a33d) 12%, #12161d); }
  .filtreSayi { font-family: 'IBM Plex Mono', monospace; opacity: 0.75; margin-left: 4px; }
  .saListeSatir { display: flex; align-items: center; gap: 14px; padding: 13px 16px; border-bottom: 1px solid #171c24; cursor: pointer; }
  .saListeUrun { font-size: 14.5px; font-weight: 600; color: #eef2f7; margin-bottom: 3px; }
  .saListeAltBilgi { font-size: 12px; color: #6c7789; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rozetDurum { flex-shrink: 0; font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 6px; border: 1px solid; }
  .geriDon { display: inline-block; font-size: 12.5px; color: #8996a8; margin-bottom: 16px; }
  .geriDon:hover { color: #dbe2ea; }
  .kalemBaslikSatir { display: flex; gap: 10px; padding: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: #5b6579; }
  .kalemSatir { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid #1a2029; }
  .kalemNo { width: 26px; flex-shrink: 0; color: #5b6579; font-size: 12px; font-family: 'IBM Plex Mono', monospace; }
  .dugumInput {
    background: transparent; border: 1px solid transparent; border-radius: 6px;
    color: #dbe2ea; font-size: 14px; padding: 6px 8px; outline: none; flex: 1;
    font-family: 'IBM Plex Sans', sans-serif;
  }
  .dugumInput:hover, .dugumInput:focus { background: #0e1116; border-color: #2a323f; }
  .kritikNokta { color: #e2694d; font-size: 10px; margin-left: 6px; flex-shrink: 0; }
  .bekleyenRozet { margin-left: 8px; font-size: 11px; font-weight: 600; color: #e2a33d; background: #e2a33d1a; border: 1px solid #e2a33d55; border-radius: 10px; padding: 2px 9px; flex-shrink: 0; }
  .bekleyenBanner { display: flex; justify-content: space-between; align-items: center; margin: 0 14px 10px; padding: 11px 14px; background: #e2a33d14; border: 1px solid #e2a33d40; border-radius: 8px; color: #e2a33d; font-size: 12.5px; font-weight: 600; }
  .bekleyenIcerik { margin: 0 14px 14px; padding: 12px 14px; background: #0e1116; border: 1px solid #1f2630; border-radius: 8px; }
  .bekleyenAltSatir { display: flex; gap: 10px; margin-top: 10px; align-items: center; }
  .bekleyenCheck { width: 17px; height: 17px; flex-shrink: 0; accent-color: #e2a33d; }
  .stokUrunSatirTek { display: flex; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid #1a2029; }
  .ayarSatiri { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid #1a2029; }
  .ayarSatiri:first-child { border-top: none; }
  .ayarToggleBtn { flex-shrink: 0; background: transparent; color: #8996a8; border: 1px solid #2a323f; border-radius: 6px; padding: 7px 14px; font-size: 12px; font-weight: 600; }
  .ayarToggleAktif { color: #3fae74; border-color: #3fae7455; background: #3fae741a; }
  .modalOverlay {
    position: fixed; inset: 0; background: rgba(6,8,11,0.72); z-index: 1000;
    display: flex; align-items: center; justify-content: center;
  }
  .modalKutu { width: 360px; background: #12161d; border: 1px solid #2a323f; border-radius: 12px; padding: 24px; }
  .modalBaslik { font-size: 16px; font-weight: 600; color: #f0f3f7; margin-bottom: 6px; }
  .modalMetin { font-size: 12.5px; color: #8996a8; margin-bottom: 14px; line-height: 1.5; }
  .modalSoru { font-size: 20px; font-weight: 600; color: #e2a33d; font-family: 'IBM Plex Mono', monospace; margin-bottom: 12px; text-align: center; background: #0e1116; border: 1px solid #1f2630; border-radius: 8px; padding: 10px; }
  .modalHata { color: #e2694d; font-size: 12px; min-height: 16px; margin-top: 8px; }
  .modalBtnSatir { display: flex; gap: 10px; margin-top: 6px; }
  .modalBtnSatir button { flex: 1; }
  .beklemeBanner {
    margin: 12px 14px 0; padding: 10px 12px; background: #e2a33d14; border: 1px solid #e2a33d4d;
    border-radius: 8px; color: #e2a33d; font-size: 12.5px; font-weight: 600; cursor: pointer;
  }
  .beklemeSatir { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid #1a2029; font-size: 13px; }
  .beklemeSatir input[type=checkbox] { width: 16px; height: 16px; accent-color: #e2a33d; flex-shrink: 0; }
  .stokUrunSatir { border-top: 1px solid #1a2029; padding: 12px 0; }
  .stokUrunUst { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
  .stokUrunAlt { display: flex; gap: 10px; align-items: center; flex-wrap: nowrap; }
  .stokKullanKutu { display: flex; gap: 6px; align-items: center; width: 210px; flex-shrink: 0; }
  .stokKullanKutu input { flex: 1; min-width: 0; }
  .stokKullanBtn { flex-shrink: 0; white-space: nowrap; background: #232b37; color: #dbe2ea; border: 1px solid #2a323f; border-radius: 6px; padding: 8px 14px; font-size: 12px; font-weight: 500; }
  .kritikToggleBtn { flex-shrink: 0; white-space: nowrap; background: transparent; color: #5b6579; border: 1px solid #2a323f; border-radius: 6px; padding: 8px 14px; font-size: 12px; font-weight: 600; }
  .kritikToggleAktif { background: #e2694d1a; color: #e2694d; border-color: #e2694d55; }
  .kritikSolukNokta { color: #e2694d66; font-size: 9px; flex-shrink: 0; margin-right: -4px; }
  .stokKritikGirdi { border-color: #e2694d !important; background: #2a1512 !important; color: #ff9d84 !important; }
  .kritikMarquee { overflow: hidden; white-space: nowrap; margin: 0 12px 14px; border: 1px solid #e2694d4d; background: #e2694d14; border-radius: 8px; padding: 8px 0; }
  .kritikMarqueeIc { display: inline-block; padding-left: 100%; animation: kritikKaydir 14s linear infinite; color: #e2694d; font-size: 11.5px; font-weight: 600; }
  @keyframes kritikKaydir { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }
  .eklePrimer { background: #e2a33d; color: #1a1305; border: none; border-radius: 6px; padding: 8px 14px; font-size: 12.5px; font-weight: 600; }
  .bilgiKutu { background: #151b23; border: 1px solid #2a323f; border-radius: 6px; padding: 9px 12px; font-size: 12.5px; color: #aab4c2; margin-bottom: 14px; }
  .tabloSarici { background: #12161d; border: 1px solid #1f2630; border-radius: 10px; overflow: hidden; }
  .tabloBaslikSatir { display: flex; gap: 10px; padding: 10px 14px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: #5b6579; border-bottom: 1px solid #1f2630; }
  .tabloSatir { display: flex; gap: 10px; padding: 7px 14px; align-items: center; border-bottom: 1px solid #171c24; }
  .tabloGirdi { background: transparent; border: 1px solid transparent; border-radius: 5px; color: #dbe2ea; padding: 6px 8px; font-size: 12.5px; min-width: 0; }
</style>
</head>
<body>

<!-- ================= FIREBASE SDK ================= -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<!-- ================= GİRİŞ EKRANI ================= -->
<div id="girisEkrani" style="height:100vh;display:flex;align-items:center;justify-content:center;background:#0e1116;">
  <div class="girisKart">
    <div class="girisLogo">⌁</div>
    <div class="girisBaslik">Giriş yap</div>
    <div class="girisAlt">Tesis Yönetim Sistemi</div>

    <label class="girisAlan">E-posta</label>
    <input class="girisInput" id="girisEposta" type="email" autocomplete="username" />

    <label class="girisAlan">Şifre</label>
    <input class="girisInput" id="girisSifre" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter'){event.preventDefault();girisGonder();}" />

    <button class="girisBtn ty-btn" id="girisButonu" onclick="girisGonder()">Giriş yap</button>
    <div class="girisHata" id="girisHataMetni"></div>
  </div>
</div>

<!-- ================= UYGULAMA ================= -->
<div id="uygulama" style="display:none;">
  <div class="ustCubuk">
    <div style="display:flex;align-items:baseline;gap:10px;">
      <span class="logo">⌁</span>
      <div>
        <div class="baslik">Tesis Yönetim Sistemi</div>
        <div class="altBaslik" id="ustAltYazi">saha ekipman ve satın alma takibi</div>
      </div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;">
      <span class="kullaniciRozeti" id="kullaniciRozeti"></span>
      <button class="ustBtn ty-btn" onclick="malzemeListesiGoster()">Kullanılan Malzemeler</button>
      <button class="ustBtn ty-btn" onclick="disaAktar()">Yedekle (dışa aktar)</button>
      <button class="ustBtn ty-btn" id="yedekYukleBtn" onclick="document.getElementById('yedekInput').click()">Yedek yükle</button>
      <button class="ustBtn ty-btn" onclick="ayarlarGoster()">⚙ Ayarlar</button>
      <button class="ustBtn ty-btn" onclick="cikisYap()">Çıkış yap</button>
      <input id="yedekInput" type="file" accept=".json" style="display:none" onchange="iceAktar(this.files[0])" />
    </div>
  </div>
  <div class="govde">
    <div class="sol" id="solMenu"></div>
    <div class="ana" id="anaPanel"></div>
    <div class="sag" id="sagMenu"></div>
  </div>
</div>
<datalist id="malzemeListesi"></datalist>

<div id="teyitModal" class="modalOverlay" style="display:none">
  <div class="modalKutu">
    <div class="modalBaslik" id="teyitBaslik"></div>
    <div class="modalMetin" id="teyitMetin"></div>
    <div class="modalSoru" id="teyitSoru"></div>
    <input class="girdi" id="teyitGirdi" type="number" placeholder="Cevap" onkeydown="if(event.key==='Enter'){event.preventDefault();teyitOnayla();}" />
    <div class="modalHata" id="teyitHata"></div>
    <div class="modalBtnSatir">
      <button class="ustBtn ty-btn" onclick="teyitIptal()">Vazgeç</button>
      <button class="eklePrimer ty-btn" id="teyitOnayBtn" onclick="teyitOnayla()">Onayla</button>
    </div>
  </div>
</div>

<script>
/* ---------------- yardımcılar ---------------- */
const uid = () => Math.random().toString(36).slice(2, 10);

/* ---------------- genel onay modalı (silme / stok onayı) ---------------- */
let teyitState = null;
function teyitIste(baslik, aciklama, geriCagirFn){
  const a = Math.floor(Math.random() * 8) + 2;
  const b = Math.floor(Math.random() * 8) + 2;
  teyitState = { cevap: a + b, fn: geriCagirFn };
  document.getElementById("teyitBaslik").textContent = baslik;
  document.getElementById("teyitMetin").textContent = aciklama;
  document.getElementById("teyitSoru").textContent = `${a} + ${b} = ?`;
  document.getElementById("teyitGirdi").value = "";
  document.getElementById("teyitHata").textContent = "";
  document.getElementById("teyitModal").style.display = "flex";
  setTimeout(() => document.getElementById("teyitGirdi").focus(), 50);
}
function teyitIptal(){
  document.getElementById("teyitModal").style.display = "none";
  teyitState = null;
}
function teyitOnayla(){
  const girdi = document.getElementById("teyitGirdi");
  const deger = parseInt(girdi.value, 10);
  if (teyitState && deger === teyitState.cevap) {
    const fn = teyitState.fn;
    document.getElementById("teyitModal").style.display = "none";
    teyitState = null;
    fn();
  } else {
    document.getElementById("teyitHata").textContent = "Yanlış cevap, tekrar deneyin.";
    girdi.value = ""; girdi.focus();
  }
}
function silOnayla(baslik, geriCagirFn){
  teyitIste(baslik, "Bu kaydı silmek üzeresiniz. Onaylamak için işlemi çözün:", geriCagirFn);
}
const bugun = () => {
  const d = new Date(); const p = n => String(n).padStart(2, "0");
  return `${p(d.getDate())}.${p(d.getMonth()+1)}.${d.getFullYear()}`;
};
const suAn = () => {
  const d = new Date(); const p = n => String(n).padStart(2, "0");
  return `${p(d.getHours())}:${p(d.getMinutes())}`;
};
function esc(str){ return (str ?? "").toString().replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }

function ornekPompa(ad){
  return { id: uid(), ad, parcalar: [], gecmis: [{ id: uid(), tarih: bugun(), aciklama: "Kayıt oluşturuldu." }] };
}
function varsayilanVeri(){
  return {
    tesisler: Array.from({length:6}).map((_,i)=>({
      id: uid(), ad: `Tesis ${i+1}`,
      makineler: [{ id: uid(), ad: "Pompa İstasyonu", pompalar: [ornekPompa("1. Pompa"), ornekPompa("2. Pompa")] }],
      depolar: []
    })),
    satinAlmalar: [],
    malzemeGecmisi: [],
    sonIslemler: []
  };
}

/* ---------------- durum ---------------- */
let state = null;
let ui = { view: "bos", secim: {}, acikTesis: new Set(), acikMakine: new Set(), acikGecmis: new Set(), duzenle: false, mesaj: "", saSecim: null, saDuzenle: false, saArama: "", saFiltre: "tumu", stokAcikTesis: new Set(), stokAcikDepo: new Set(), stokDuzenle: false, stokBekleyenAcik: new Set(), stokBekleyenSecim: {}, stokBekleyenDepo: {} };

function sanitizeVeri(v){
  if (!v) v = varsayilanVeri();
  if (!v.tesisler) v.tesisler = varsayilanVeri().tesisler;
  if (!v.malzemeGecmisi) v.malzemeGecmisi = [];
  v.malzemeGecmisi = v.malzemeGecmisi.map(x => typeof x === "string" ? { id: uid(), ad: x } : x);
  if (!v.satinAlmalar) v.satinAlmalar = [];
  if (!v.sonIslemler) v.sonIslemler = [];
  v.tesisler.forEach(t => { if (!Array.isArray(t.depolar)) t.depolar = []; });
  v.satinAlmalar = v.satinAlmalar.map(s => {
    if (Array.isArray(s.kalemler)) return s;
    return {
      id: s.id, siparisNo: s.siparisNo || "", gelisTarihi: s.gelisTarihi || bugun(),
      kalemler: [{ id: uid(), urun: s.urun || "", miktar: s.miktar || "", birim: s.birim || "", teslimTarihi: s.teslimTarihi || "", durum: s.durum || "Gelmedi" }],
      yerler: s.kullanildigiYer ? [{ id: uid(), ad: s.kullanildigiYer }] : [{ id: uid(), ad: "" }],
      firma: s.firma || "",
      eklenmeTarihi: s.eklenmeTarihi || bugun(), eklenmeSaati: s.eklenmeSaati || suAn()
    };
  });
  return v;
}

/* ---------------- Firebase / Firestore ---------------- */
const firebaseConfig = {
  apiKey: "AIzaSyC5Jh7at2UmUrNnksDv2jDy5aonh_M3eA4",
  authDomain: "tesis-yonetim-d7502.firebaseapp.com",
  projectId: "tesis-yonetim-d7502",
  storageBucket: "tesis-yonetim-d7502.firebasestorage.app",
  messagingSenderId: "540630226337",
  appId: "1:540630226337:web:f1f48b6eab8c92b11127e0"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const veriRef = db.collection("veri").doc("ana");

let mevcutKullanici = null;
let mevcutRol = "personel";
let dinleyiciBaslatildi = false;

function adminMi(){ return mevcutRol === "yonetici"; }

function saveData(){
  if (!state) return;
  veriRef.set(state).catch(err => console.error("Kaydetme hatası:", err));
}
function veriDinlemeyeBasla(){
  if (dinleyiciBaslatildi) return;
  dinleyiciBaslatildi = true;
  veriRef.get().then(snap => {
    if (!snap.exists) { veriRef.set(varsayilanVeri()); }
  });
  veriRef.onSnapshot(snap => {
    if (!snap.exists) return;
    state = sanitizeVeri(snap.data());
    if (document.getElementById("uygulama").style.display !== "none") {
      if (!ui.acikTesis || ui.acikTesis.size === 0) ui.acikTesis.add(state.tesisler[0]?.id);
      render();
    }
  }, err => {
    console.error("Veri dinleme hatası:", err);
    ui.mesaj = "Veri sunucusuna bağlanılamadı. İnternet bağlantınızı kontrol edin.";
  });
}
async function kullaniciRoluAyarla(user){
  mevcutKullanici = user;
  const ref = db.collection("kullanicilar").doc(user.uid);
  const snap = await ref.get();
  if (!snap.exists) {
    const hepsi = await db.collection("kullanicilar").get();
    mevcutRol = hepsi.empty ? "yonetici" : "personel";
    await ref.set({ eposta: user.email, rol: mevcutRol });
  } else {
    mevcutRol = snap.data().rol || "personel";
  }
}
function malzemeGecmisineEkle(ad){
  if (!ad) return;
  const temiz = ad.trim();
  if (!temiz) return;
  const varMi = state.malzemeGecmisi.some(x => x.ad.toLowerCase() === temiz.toLowerCase());
  if (!varMi) state.malzemeGecmisi.push({ id: uid(), ad: temiz });
}
function malzemeListesiEkle(){
  state.malzemeGecmisi.unshift({ id: uid(), ad: "" });
  saveData(); render();
}
function malzemeListesiGuncelle(id, deger){
  const m = state.malzemeGecmisi.find(x => x.id === id); if (m) m.ad = deger;
  saveData(); render();
}
function malzemeListesindenSil(id){
  state.malzemeGecmisi = state.malzemeGecmisi.filter(x => x.id !== id);
  saveData(); render();
}
function malzemeListesiGoster(){ ui.view = "malzemeler"; render(); }

/* ---------------- son işlemler ---------------- */
function kaydetIslem(aciklama, hedef){
  if (!state.sonIslemler) state.sonIslemler = [];
  state.sonIslemler.unshift({ id: uid(), aciklama, hedef, tarih: bugun(), saat: suAn() });
  if (state.sonIslemler.length > 30) state.sonIslemler.length = 30;
  saveData();
}
function islemeGitById(id){
  const islem = (state.sonIslemler || []).find(x => x.id === id);
  if (!islem || !islem.hedef) return;
  const h = islem.hedef;
  if (h.view === "pompa") pompaSec(h.tesisId, h.makineId, h.pompaId);
  else if (h.view === "satinalma-detay") satinAlmaSec(h.satId);
  else if (h.view === "rapor") raporGoster();
  else if (h.view === "malzemeler") malzemeListesiGoster();
  else if (h.view === "stok") stokGoster();
  else if (h.view === "satinalma") satinAlmaGoster();
}

/* ---------------- stok ---------------- */
function stokGoster(){ ui.view = "stok"; render(); }
function stokDuzenleAcKapat(){ ui.stokDuzenle = !ui.stokDuzenle; render(); }
function stokTesisAcKapat(id){ ui.stokAcikTesis.has(id) ? ui.stokAcikTesis.delete(id) : ui.stokAcikTesis.add(id); render(); }
function stokDepoAcKapat(id){ ui.stokAcikDepo.has(id) ? ui.stokAcikDepo.delete(id) : ui.stokAcikDepo.add(id); render(); }
function depoEkle(tesisId){
  const t = state.tesisler.find(x => x.id === tesisId);
  const yeni = { id: uid(), ad: "Yeni Depo", urunler: [] };
  t.depolar.push(yeni);
  ui.stokAcikDepo.add(yeni.id);
  kaydetIslem(`Yeni depo eklendi: ${yeni.ad} (${t.ad})`, { view: "stok" });
  saveData(); render();
}
function depoSil(tesisId, depoId){
  const t = state.tesisler.find(x => x.id === tesisId);
  t.depolar = t.depolar.filter(d => d.id !== depoId);
  saveData(); render();
}
function depoAdGuncelle(tesisId, depoId, ad){
  const t = state.tesisler.find(x => x.id === tesisId);
  const d = t.depolar.find(x => x.id === depoId); if (d) d.ad = ad;
  saveData(); render();
}
function stokUrunBul(tesisId, depoId, urunId){
  const t = state.tesisler.find(x => x.id === tesisId);
  const d = t?.depolar.find(x => x.id === depoId);
  const u = d?.urunler.find(x => x.id === urunId);
  return { t, d, u };
}
function stokUrunEkle(tesisId, depoId){
  const t = state.tesisler.find(x => x.id === tesisId);
  const d = t.depolar.find(x => x.id === depoId);
  d.urunler.push({ id: uid(), ad: "", miktar: 0, birim: "", kritikTakip: false, kritikEsik: 0 });
  saveData(); render();
}
function stokUrunSil(tesisId, depoId, urunId){
  const t = state.tesisler.find(x => x.id === tesisId);
  const d = t.depolar.find(x => x.id === depoId);
  d.urunler = d.urunler.filter(x => x.id !== urunId);
  saveData(); render();
}
function stokUrunGuncelle(tesisId, depoId, urunId, alan, deger){
  const { u } = stokUrunBul(tesisId, depoId, urunId); if (u) u[alan] = deger;
  if (alan === "ad") malzemeGecmisineEkle(deger);
  saveData(); render();
}
function stokKritikDegistir(tesisId, depoId, urunId){
  const { u } = stokUrunBul(tesisId, depoId, urunId); if (!u) return;
  u.kritikTakip = !u.kritikTakip;
  saveData(); render();
}
function tesisKritikMi(t){
  return (t.depolar || []).some(d => (d.urunler || []).some(u => u.kritikTakip && (parseFloat(u.miktar) || 0) <= (parseFloat(u.kritikEsik) || 0)));
}
function kritikTesisAdlari(){
  return state.tesisler.filter(tesisKritikMi).map(t => t.ad);
}
function urunKritikMi(ad){
  if (!ad) return false;
  const q = ad.trim().toLowerCase();
  if (!q) return false;
  return state.tesisler.some(t => (t.depolar || []).some(d => (d.urunler || []).some(u =>
    u.ad.trim().toLowerCase() === q && u.kritikTakip && (parseFloat(u.miktar) || 0) <= (parseFloat(u.kritikEsik) || 0)
  )));
}

/* ---------------- satın almadan stoğa bekleyen ürünler ---------------- */
function bekleyenStokKalemleri(tesisAdi){
  const sonuc = [];
  state.satinAlmalar.forEach(sat => {
    if (!(sat.yerler || []).some(y => y.ad === tesisAdi)) return;
    (sat.kalemler || []).forEach(k => {
      if (!k.stokaAktarildi && k.durum === "Geldi" && k.urun && k.urun.trim()) {
        sonuc.push({ satId: sat.id, kalemId: k.id, urun: k.urun, miktar: k.miktar, birim: k.birim });
      }
    });
  });
  return sonuc;
}
function stokBekleyenAcKapat(tesisId){ ui.stokBekleyenAcik.has(tesisId) ? ui.stokBekleyenAcik.delete(tesisId) : ui.stokBekleyenAcik.add(tesisId); render(); }
function stokBekleyenSecToggle(tesisId, satId, kalemId){
  const anahtar = satId + "|" + kalemId;
  if (!ui.stokBekleyenSecim[tesisId]) ui.stokBekleyenSecim[tesisId] = new Set();
  const s = ui.stokBekleyenSecim[tesisId];
  s.has(anahtar) ? s.delete(anahtar) : s.add(anahtar);
  render();
}
function stokBekleyenDepoSec(tesisId, depoId){ ui.stokBekleyenDepo[tesisId] = depoId; render(); }
function stokBekleyenAlanGuncelle(satId, kalemId, alan, deger){
  const sat = satinAlmaBul(satId); const k = sat?.kalemler.find(x => x.id === kalemId); if (k) k[alan] = deger;
  if (alan === "urun") malzemeGecmisineEkle(deger);
  saveData(); render();
}
function stokBekleyenOnayla(tesisId){
  const t = state.tesisler.find(x => x.id === tesisId);
  const secilenler = ui.stokBekleyenSecim[tesisId];
  if (!secilenler || secilenler.size === 0) { ui.mesaj = "Lütfen stoğa eklenecek en az bir ürün seçin."; render(); return; }
  teyitIste("Stok Onayı", "Seçilen ürünleri stoğa eklemek üzeresiniz. Onaylamak için işlemi çözün:", () => stokBekleyenIsle(tesisId));
}
function stokBekleyenIsle(tesisId){
  const t = state.tesisler.find(x => x.id === tesisId);
  const secilenler = ui.stokBekleyenSecim[tesisId] || new Set();
  let depoId = ui.stokBekleyenDepo[tesisId];
  let depo = t.depolar.find(d => d.id === depoId);
  if (!depo) {
    depo = t.depolar.find(d => d.ad === "Genel Depo");
    if (!depo) { depo = { id: uid(), ad: "Genel Depo", urunler: [] }; t.depolar.push(depo); }
  }
  const bekleyenler = bekleyenStokKalemleri(t.ad);
  let sayac = 0;
  bekleyenler.forEach(b => {
    const anahtar = b.satId + "|" + b.kalemId;
    malzemeGecmisineEkle(b.urun);
    if (!secilenler.has(anahtar)) return;
    const sat = satinAlmaBul(b.satId); const k = sat?.kalemler.find(x => x.id === b.kalemId);
    if (!k) return;
    const adTemiz = (k.urun || "").trim();
    const mevcut = depo.urunler.find(u => u.ad.trim().toLowerCase() === adTemiz.toLowerCase());
    const miktar = parseFloat(k.miktar) || 0;
    if (mevcut) { mevcut.miktar = (parseFloat(mevcut.miktar) || 0) + miktar; }
    else { depo.urunler.push({ id: uid(), ad: adTemiz, miktar, birim: k.birim || "", kritikTakip: false, kritikEsik: 0 }); }
    k.stokaAktarildi = true;
    sayac++;
  });
  delete ui.stokBekleyenSecim[tesisId];
  kaydetIslem(`Stok onaylandı: ${sayac} ürün → ${t.ad} / ${depo.ad}`, { view: "stok" });
  ui.mesaj = `${sayac} ürün ${t.ad} / ${depo.ad} stoğuna eklendi.`;
  saveData(); render();
}

/* ---------------- görünürlük ayarları ---------------- */
function gorunurTesisler(){ return state.tesisler.filter(t => !t.gizli); }
let kullanicilarListesi = [];
function ayarlarGoster(){
  ui.view = "ayarlar"; render();
  if (adminMi()) {
    db.collection("kullanicilar").get().then(snap => {
      kullanicilarListesi = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      if (ui.view === "ayarlar") render();
    }).catch(err => console.error(err));
  }
}
function kullaniciRoluDegistir(kullaniciId, yeniRol){
  db.collection("kullanicilar").doc(kullaniciId).update({ rol: yeniRol }).then(() => {
    const k = kullanicilarListesi.find(x => x.id === kullaniciId); if (k) k.rol = yeniRol;
    render();
  }).catch(err => console.error(err));
}
function tesisGizleDegistir(tesisId){
  const t = state.tesisler.find(x => x.id === tesisId); if (!t) return;
  t.gizli = !t.gizli;
  saveData(); render();
}

/* ---------------- giriş / oturum ---------------- */
function girisGonder(){
  const eposta = document.getElementById("girisEposta").value.trim();
  const sifre = document.getElementById("girisSifre").value;
  const hataEl = document.getElementById("girisHataMetni");
  hataEl.textContent = "";
  if (!eposta || !sifre) { hataEl.textContent = "E-posta ve şifre gerekli."; return; }
  const btn = document.getElementById("girisButonu");
  btn.textContent = "Giriş yapılıyor..."; btn.disabled = true;
  auth.signInWithEmailAndPassword(eposta, sifre)
    .catch(err => {
      btn.textContent = "Giriş yap"; btn.disabled = false;
      if (err.code === "auth/invalid-credential" || err.code === "auth/wrong-password" || err.code === "auth/user-not-found") {
        hataEl.textContent = "E-posta veya şifre hatalı.";
      } else if (err.code === "auth/invalid-email") {
        hataEl.textContent = "Geçerli bir e-posta adresi girin.";
      } else if (err.code === "auth/too-many-requests") {
        hataEl.textContent = "Çok fazla deneme yapıldı. Biraz sonra tekrar deneyin.";
      } else {
        hataEl.textContent = "Giriş yapılamadı: " + err.message;
      }
    });
}
function cikisYap(){
  auth.signOut();
}
async function girisiTamamla(user){
  await kullaniciRoluAyarla(user);
  document.getElementById("girisEkrani").style.display = "none";
  document.getElementById("uygulama").style.display = "flex";
  document.getElementById("kullaniciRozeti").textContent = `${user.email} (${mevcutRol === "yonetici" ? "Yönetici" : "Personel"})`;
  document.getElementById("yedekYukleBtn").style.display = adminMi() ? "" : "none";
  veriDinlemeyeBasla();
}
function girisEkraniniGoster(){
  mevcutKullanici = null; mevcutRol = "personel"; dinleyiciBaslatildi = false; state = null;
  document.getElementById("uygulama").style.display = "none";
  document.getElementById("girisEkrani").style.display = "flex";
  document.getElementById("girisSifre").value = "";
  const btn = document.getElementById("girisButonu");
  if (btn) { btn.textContent = "Giriş yap"; btn.disabled = false; }
}

/* ---------------- başlangıç ---------------- */
window.addEventListener("DOMContentLoaded", () => {
  auth.onAuthStateChanged(user => {
    if (user) girisiTamamla(user);
    else girisEkraniniGoster();
  });
});

/* ---------------- tesis / makine / pompa ---------------- */
function pompaBul(){
  const t = state.tesisler.find(x => x.id === ui.secim.tesisId);
  const m = t?.makineler.find(x => x.id === ui.secim.makineId);
  const p = m?.pompalar.find(x => x.id === ui.secim.pompaId);
  return { t, m, p };
}
function tesisEkle(){
  const yeni = { id: uid(), ad: "Yeni Tesis", makineler: [] };
  state.tesisler.push(yeni); ui.acikTesis.add(yeni.id); saveData(); render();
}
function tesisSil(tesisId){
  state.tesisler = state.tesisler.filter(t => t.id !== tesisId);
  if (ui.secim.tesisId === tesisId) { ui.secim = {}; ui.view = "bos"; }
  saveData(); render();
}
function tesisAdGuncelle(tesisId, ad){
  const t = state.tesisler.find(x => x.id === tesisId); if (t) t.ad = ad;
  saveData(); render();
}
function makineEkle(tesisId){
  const t = state.tesisler.find(x => x.id === tesisId);
  const yeni = { id: uid(), ad: "Yeni Makine", pompalar: [] };
  t.makineler.push(yeni); ui.acikMakine.add(yeni.id); saveData(); render();
}
function makineSil(tesisId, makineId){
  const t = state.tesisler.find(x => x.id === tesisId);
  t.makineler = t.makineler.filter(m => m.id !== makineId);
  if (ui.secim.makineId === makineId) { ui.secim = {}; ui.view = "bos"; }
  saveData(); render();
}
function makineAdGuncelle(tesisId, makineId, ad){
  const t = state.tesisler.find(x => x.id === tesisId);
  const m = t.makineler.find(x => x.id === makineId); if (m) m.ad = ad;
  saveData(); render();
}
function pompaEkle(tesisId, makineId){
  const t = state.tesisler.find(x => x.id === tesisId);
  const m = t.makineler.find(x => x.id === makineId);
  const yeni = ornekPompa(`${m.pompalar.length+1}. Pompa`);
  m.pompalar.push(yeni);
  kaydetIslem(`Yeni pompa eklendi: ${yeni.ad} (${t.ad} / ${m.ad})`, { view: "pompa", tesisId, makineId, pompaId: yeni.id });
  saveData(); render();
}
function pompaSil(tesisId, makineId, pompaId){
  const t = state.tesisler.find(x => x.id === tesisId);
  const m = t.makineler.find(x => x.id === makineId);
  m.pompalar = m.pompalar.filter(p => p.id !== pompaId);
  if (ui.secim.pompaId === pompaId) { ui.secim = {}; ui.view = "bos"; }
  saveData(); render();
}
function pompaAdGuncelle(ad){
  const { p } = pompaBul(); if (p) p.ad = ad; saveData(); render();
}
function parcaEkle(){
  const { p } = pompaBul(); p.parcalar.push({ id: uid(), ad: "", malzeme: "", adet: 1 }); saveData(); render();
}
function parcaGuncelle(parcaId, alan, deger){
  const { p } = pompaBul(); const pr = p.parcalar.find(x => x.id === parcaId); if (pr) pr[alan] = deger;
  if (alan === "ad") malzemeGecmisineEkle(deger);

function raporGoster(){

function raporKaydet(){
  const t = state.tesisler.find(x => x.id === raporForm.tesisId);
  const m = t?.makineler.find(x => x.id === raporForm.makineId);
  const p = m?.pompalar.find(x => x.id === raporForm.pompaId);
  if (!t || !m || !p) { ui.mesaj = "Lütfen tesis, makine ve pompa seçin."; render(); return; }
  const tarih = raporForm.tarih || bugun();
  const kullanilanlar = raporForm.malzemeler
    .map(x => ({ id: uid(), ad: x.ad.trim(), adet: x.adet || 1 }))
    .filter(x => x.ad);

  kullanilanlar.forEach(({ ad }) => malzemeGecmisineEkle(ad));

}

function saTumKalemler(){
  return state.satinAlmalar.flatMap(s => s.kalemler.map(k => ({ ...k, satId: s.id })));
}
function saDurumFiltreDegistir(f){ ui.saFiltre = f; render(); }
function saFiltreliListe(){
  const q = (ui.saArama || "").trim().toLowerCase();
  let liste = state.satinAlmalar;
  if (q) {
    liste = liste.filter(s =>
      [s.siparisNo, s.firma,
       ...(s.kalemler || []).map(k => k.urun),
       ...(s.yerler || []).map(y => y.ad)]
        .some(alan => (alan || "").toLowerCase().includes(q))
    );
  }
  if (ui.saFiltre === "gelen") {
    liste = liste.filter(s => s.kalemler.length > 0 && s.kalemler.every(k => k.durum === "Geldi"));
  } else if (ui.saFiltre === "gelmeyen") {
    liste = liste.filter(s => s.kalemler.some(k => k.durum === "Gelmedi"));
  }
  return liste;
}
function saListesiRender(){
  const kap = document.getElementById("saListesiKapsayici");
  if (!kap) return;
  const liste = saFiltreliListe();
  let h = `<div class="tabloSarici">`;
  if (liste.length === 0) {
    h += `<div class="bosMetin" style="padding:16px">${state.satinAlmalar.length===0 ? "Henüz satın alma kaydı yok. \"+ satın alma ekle\" ile başlayın." : "Aramanla eşleşen bir kayıt bulunamadı."}</div>`;
  } else {
    liste.forEach(sat => {
      const urunler = (sat.kalemler || []).map(k => k.urun).filter(Boolean);
      const gelenSayi = (sat.kalemler || []).filter(k => k.durum === "Geldi").length;
      const toplam = (sat.kalemler || []).length;
      const yerMetni = (sat.yerler || []).map(y => y.ad).filter(Boolean).join(", ");
      const renk = gelenSayi === toplam ? durumRenk.Geldi : durumRenk.Gelmedi;
      h += `<div class="saListeSatir ty-satir" onclick="satinAlmaSec('${sat.id}')">
        <div style="flex:1;min-width:0">
          <div class="saListeUrun">${esc(urunler.slice(0,3).join(", ")) || "(ürün adı girilmedi)"}${urunler.length>3?` <span style="color:#5b6579">+${urunler.length-3} diğer</span>`:''}</div>
          <div class="saListeAltBilgi">${[sat.siparisNo && ('Sipariş No: '+sat.siparisNo), yerMetni].filter(Boolean).map(esc).join(' · ') || '—'}</div>
        </div>
        <span class="rozetDurum" style="color:${renk};border-color:${renk}55;background:${renk}1a">${gelenSayi}/${toplam} geldi</span>
      </div>`;
    });
  }
  h += `</div>`;
  kap.innerHTML = h;
}

/* ---------------- yedekleme ---------------- */
function disaAktar(){
  const veri = { ...state, olusturma: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(veri, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `tesis-yedek-${bugun().replaceAll(".", "-")}.json`; a.click();
  URL.revokeObjectURL(url);
}
function iceAktar(dosya){
  if (!dosya) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const veri = JSON.parse(reader.result);
      if (veri.tesisler) state.tesisler = veri.tesisler;
      if (veri.satinAlmalar) state.satinAlmalar = veri.satinAlmalar;
      ui.mesaj = "Yedek başarıyla geri yüklendi.";
      saveData(); render();
    } catch(e){ ui.mesaj = "Yedek dosyası okunamadı. Geçerli bir JSON dosyası seçin."; render(); }
  };
  reader.readAsText(dosya);
}

    if (!sat) { ui.view = "satinalma"; renderAna(); return; }
    const baslikAlan = (etiket, key, genislik) => `
      <div style="${genislik?`width:${genislik}px`:'flex:1'}">
        <div class="bosMetin" style="margin-bottom:5px;font-style:normal">${etiket}</div>
        ${ui.saDuzenle
          ? `<input class="girdi" value="${esc(sat[key])}" onchange="satinAlmaGuncelle('${sat.id}','${key}',this.value)" />`
          : `<div class="deger">${esc(sat[key]) || '—'}</div>`}
      </div>`;

    let h = `<div class="geriDon ty-btn" onclick="satinAlmaGoster()">‹ Satın Almalar listesine dön</div>`;
    h += `<div class="pompaBaslikSatir">
      <div class="pompaAdBaslik">${esc(sat.siparisNo) ? ('Sipariş No: ' + esc(sat.siparisNo)) : 'İsimsiz Satınalma Talebi'}</div>
      <div style="display:flex;gap:8px">
        <button class="${ui.saDuzenle?'duzenleBtnAktif':'duzenleBtn'} ty-btn" onclick="satinAlmaDuzenleAcKapat()">${ui.saDuzenle?'Düzenlemeyi bitir':'Düzenle'}</button>
        ${adminMi() ? `<button class="ustBtn ty-btn" style="color:#e2694d" onclick="silOnayla('Satın Alma Talebini Sil', ()=>satinAlmaSil('${sat.id}'))">Sil</button>` : ''}
      </div>
    </div>`;

    h += `<div class="kart">
      <div class="kartBaslik" style="margin-bottom:12px">Satınalma Talep Formu</div>
      <div style="display:flex;gap:14px;margin-bottom:14px">
        ${baslikAlan('Geliş Tarihi', 'gelisTarihi', 140)}
        ${baslikAlan('Satınalma (Sipariş) No', 'siparisNo')}
      </div>
    </div>`;

    h += `<div class="kart">
      <div class="kartBaslikSatir">
        <span class="kartBaslik">Malzemenin Cinsi ve Özellikleri (Ürün)</span>
        ${ui.saDuzenle?`<button class="ekleMini ty-btn" onclick="saKalemEkle('${sat.id}')">+ satır ekle</button>`:''}
      </div>
      <div class="kalemBaslikSatir">
        <span style="width:26px"></span><span style="flex:2">Ürün</span><span style="flex:1">Miktar</span><span style="flex:1">Birim</span><span style="width:120px">Teslim Tarihi</span><span style="width:90px">Durum</span><span style="width:20px"></span>
      </div>
      ${sat.kalemler.map((k, i) => `
        <div class="kalemSatir">
          <span class="kalemNo">${i+1}</span>
          ${urunKritikMi(k.urun) ? `<span class="kritikSolukNokta" title="Bu ürün kritik stokta">●</span>` : ''}
          ${ui.saDuzenle ? `
            <input class="parcaGirdi" style="flex:2" list="malzemeListesi" placeholder="Ürün adı" value="${esc(k.urun)}" onchange="saKalemGuncelle('${sat.id}','${k.id}','urun',this.value)" />
            <input class="parcaGirdi" style="flex:1" placeholder="Miktar" value="${esc(k.miktar)}" onchange="saKalemGuncelle('${sat.id}','${k.id}','miktar',this.value)" />
            <input class="parcaGirdi" style="flex:1" placeholder="Birim" value="${esc(k.birim)}" onchange="saKalemGuncelle('${sat.id}','${k.id}','birim',this.value)" />
            <input class="parcaGirdi" style="width:120px;flex:none" placeholder="gg.aa.yyyy" value="${esc(k.teslimTarihi)}" onchange="saKalemGuncelle('${sat.id}','${k.id}','teslimTarihi',this.value)" />
          ` : `
            <span style="flex:2;color:#e6edf3">${esc(k.urun) || '—'}</span>
            <span style="flex:1;color:#8996a8">${esc(k.miktar) || '—'}</span>
            <span style="flex:1;color:#8996a8">${esc(k.birim) || '—'}</span>
            <span style="width:120px;color:#8996a8;font-family:'IBM Plex Mono',monospace">${esc(k.teslimTarihi) || '—'}</span>
          `}
          <button class="ty-btn" style="width:90px;flex:none;background:${durumRenk[k.durum]}1a;color:${durumRenk[k.durum]};font-weight:600;border:1px solid ${durumRenk[k.durum]}55;border-radius:6px;padding:6px 0;font-size:11.5px" onclick="saKalemDurumDegistir('${sat.id}','${k.id}')">${k.durum}</button>
          ${ui.saDuzenle ? `<span class="silIkon" style="width:20px" onclick="silOnayla('Ürünü Sil', ()=>saKalemSil('${sat.id}','${k.id}'))">×</span>` : `<span style="width:20px"></span>`}
        </div>`).join('')}
    </div>`;

    h += `<div class="kart">
      <div class="kartBaslikSatir">
        <span class="kartBaslik">Kullanıldığı Yer</span>
        ${ui.saDuzenle?`<button class="ekleMini ty-btn" onclick="saYerEkle('${sat.id}')">+ satır ekle</button>`:''}
      </div>
      ${sat.yerler.map((y, i) => `
        <div class="kalemSatir">
          <span class="kalemNo">${i+1}</span>
          ${ui.saDuzenle
            ? `<select class="parcaGirdi" style="flex:1" onchange="saYerGuncelle('${sat.id}','${y.id}',this.value)">
                 <option value="">— tesis seç —</option>
                 ${gorunurTesisler().map(t => `<option value="${esc(t.ad)}" ${t.ad===y.ad?'selected':''}>${esc(t.ad)}</option>`).join('')}
               </select>
               <span class="silIkon" style="width:20px" onclick="silOnayla('Satırı Sil', ()=>saYerSil('${sat.id}','${y.id}'))">×</span>`
            : `<span style="flex:1;color:#c7cfdb">${esc(y.ad) || '—'}</span>`}
        </div>`).join('')}
    </div>`;

    h += `<div class="kart">
      <div class="kartBaslik" style="margin-bottom:12px">Sipariş Bilgileri</div>
      <div>${baslikAlan('Sipariş Edilmesi İstenen Firma / Firmalar', 'firma')}</div>
    </div>`;

    h += `<div class="bosMetin">Kayıt zamanı: ${esc(sat.eklenmeTarihi)} ${esc(sat.eklenmeSaati)}</div>`;

    el.innerHTML = h;
  }
}
</script>
</body>
</html>
