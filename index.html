<script>
/* ---------------- yardımcılar ---------------- */
const uid = () => Math.random().toString(36).slice(2, 10);

/* ---------------- genel onay modalı (silme / stok onayı) ---------------- */
let teyitState = null;
function teyitIste(baslik, aciklama, geriCagirFn){
  const a = Math.floor(Math.random() * 8) + 2;
  const b = Math.floor(Math.random() * 8) + 2;
  teyitState = { cevap: a + b, fn: geriCagirFn };
  document.getElementById("teyitBaslik").textContent = baslik;
  document.getElementById("teyitMetin").textContent = aciklama;
  document.getElementById("teyitSoru").textContent = `${a} + ${b} = ?`;
  document.getElementById("teyitGirdi").value = "";
  document.getElementById("teyitHata").textContent = "";
  document.getElementById("teyitModal").style.display = "flex";
  setTimeout(() => document.getElementById("teyitGirdi").focus(), 50);
}
function modalKapat(){
  const modal = document.getElementById("teyitModal");
  modal.classList.add("modalKapaniyor");
  setTimeout(() => {
    modal.style.display = "none";
    modal.classList.remove("modalKapaniyor");
  }, 180);
}
function teyitIptal(){
  modalKapat();
  teyitState = null;
}
function teyitOnayla(){
  const girdi = document.getElementById("teyitGirdi");
  const deger = parseInt(girdi.value, 10);
  if (teyitState && deger === teyitState.cevap) {
    const fn = teyitState.fn;
    modalKapat();
    teyitState = null;
    fn();
  } else {
    document.getElementById("teyitHata").textContent = "Yanlış cevap, tekrar deneyin.";
    girdi.value = ""; girdi.focus();
  }
}
function silOnayla(baslik, geriCagirFn){
  teyitIste(baslik, "Bu kaydı silmek üzeresiniz. Onaylamak için işlemi çözün:", geriCagirFn);
}
const bugun = () => {
  const d = new Date(); const p = n => String(n).padStart(2, "0");
  return `${p(d.getDate())}.${p(d.getMonth()+1)}.${d.getFullYear()}`;
};
const suAn = () => {
  const d = new Date(); const p = n => String(n).padStart(2, "0");
  return `${p(d.getHours())}:${p(d.getMinutes())}`;
};
function esc(str){ return (str ?? "").toString().replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
function toastGoster(mesaj, tip){
  const kapsayici = document.getElementById("toastKapsayici");
  if (!kapsayici) return;
  const toast = document.createElement("div");
  toast.className = "toast " + (tip === "hata" ? "toastHata" : "toastBasari");
  toast.innerHTML = `<span class="toastIkon">${tip === "hata" ? "⚠" : "✓"}</span><span>${esc(mesaj)}</span>`;
  kapsayici.appendChild(toast);
  setTimeout(() => {
    toast.classList.add("toastCik");
    setTimeout(() => toast.remove(), 300);
  }, 2400);
}
function tarihAyristir(str){
  if (!str) return null;
  const temiz = str.trim();
  const parcalar = temiz.split(/[.\/\-]/).map(x => x.trim()).filter(Boolean);
  if (parcalar.length !== 3) return null;
  let [g, a, y] = parcalar.map(x => parseInt(x, 10));
  if (parcalar[0].length === 4) { const t = g; g = y; y = t; } // yyyy-aa-gg gibi girilmişse çevir
  if (!g || !a || !y) return null;
  if (y < 100) y += 2000;
  const d = new Date(y, a - 1, g);
  if (isNaN(d.getTime())) return null;
  if (d.getFullYear() !== y || d.getMonth() !== a - 1 || d.getDate() !== g) return null;
  return d;
}
function tarihFormatla(d){
  const p = n => String(n).padStart(2, "0");
  return `${p(d.getDate())}.${p(d.getMonth()+1)}.${d.getFullYear()}`;
}
function gunFarki(d1, d2){ return Math.round((d2 - d1) / (1000*60*60*24)); }

function ornekPompa(ad){
  return { id: uid(), ad, parcalar: [], gecmis: [{ id: uid(), tarih: bugun(), aciklama: "Kayıt oluşturuldu." }], bakimlar: [] };
}
function varsayilanVeri(){
  return {
    tesisler: Array.from({length:6}).map((_,i)=>({
      id: uid(), ad: `Tesis ${i+1}`,
      makineler: [{ id: uid(), ad: "Pompa İstasyonu", pompalar: [ornekPompa("1. Pompa"), ornekPompa("2. Pompa")], bakimlar: [] }],
      depolar: []
    })),
    satinAlmalar: [],
    malzemeGecmisi: [],
    sonIslemler: []
  };
}

/* ---------------- durum ---------------- */
let state = null;
let ui = { view: "anasayfa", secim: {}, acikTesis: new Set(), acikMakine: new Set(), acikGecmis: new Set(), duzenle: false, mesaj: "", saSecim: null, saDuzenle: false, saArama: "", saFiltre: "tumu", stokAcikTesis: new Set(), stokAcikDepo: new Set(), stokDuzenle: false, stokBekleyenAcik: new Set(), stokBekleyenSecim: {}, stokBekleyenDepo: {}, bakimAcikTesis: new Set(), bakimAcikMakine: new Set(), bakimAcikPompa: new Set(), genelArama: "", siralaModu: false, sistemKayitlariAcik: false };

function sanitizeVeri(v){
  if (!v) v = varsayilanVeri();
  if (!v.tesisler) v.tesisler = varsayilanVeri().tesisler;
  if (!v.malzemeGecmisi) v.malzemeGecmisi = [];
  v.malzemeGecmisi = v.malzemeGecmisi.map(x => typeof x === "string" ? { id: uid(), ad: x } : x);
  if (!v.satinAlmalar) v.satinAlmalar = [];
  if (!v.sonIslemler) v.sonIslemler = [];
  v.tesisler.forEach(t => {
    if (!Array.isArray(t.depolar)) t.depolar = [];
    (t.makineler || []).forEach(m => {
      if (!Array.isArray(m.bakimlar)) m.bakimlar = [];
      (m.pompalar || []).forEach(p => { if (!Array.isArray(p.bakimlar)) p.bakimlar = []; });
    });
  });
  v.satinAlmalar = v.satinAlmalar.map(s => {
    if (Array.isArray(s.kalemler)) return s;
    return {
      id: s.id, siparisNo: s.siparisNo || "", gelisTarihi: s.gelisTarihi || bugun(),
      kalemler: [{ id: uid(), urun: s.urun || "", miktar: s.miktar || "", birim: s.birim || "", teslimTarihi: s.teslimTarihi || "", durum: s.durum || "Gelmedi" }],
      yerler: s.kullanildigiYer ? [{ id: uid(), ad: s.kullanildigiYer }] : [{ id: uid(), ad: "" }],
      firma: s.firma || "",
      eklenmeTarihi: s.eklenmeTarihi || bugun(), eklenmeSaati: s.eklenmeSaati || suAn()
    };
  });
  return v;
}

/* ---------------- Firebase / Firestore ---------------- */
const firebaseConfig = {
  apiKey: "AIzaSyC5Jh7at2UmUrNnksDv2jDy5aonh_M3eA4",
  authDomain: "tesis-yonetim-d7502.firebaseapp.com",
  projectId: "tesis-yonetim-d7502",
  storageBucket: "tesis-yonetim-d7502.firebasestorage.app",
  messagingSenderId: "540630226337",
  appId: "1:540630226337:web:f1f48b6eab8c92b11127e0"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const veriRef = db.collection("veri").doc("ana");

let mevcutKullanici = null;
let mevcutRol = "personel";
let mevcutTesisErisimi = null;
let dinleyiciBaslatildi = false;

function adminMi(){ return mevcutRol === "yonetici"; }

function saveData(){
  if (!state) return;
  veriRef.set(state).catch(err => {
    console.error("Kaydetme hatası:", err);
    toastGoster("Değişiklik kaydedilemedi. İnternet bağlantınızı kontrol edip tekrar deneyin.", "hata");
  });
}
function veriDinlemeyeBasla(){
  if (dinleyiciBaslatildi) return;
  dinleyiciBaslatildi = true;
  veriRef.get().then(snap => {
    if (!snap.exists) { veriRef.set(varsayilanVeri()); }
  });
  veriRef.onSnapshot(snap => {
    if (!snap.exists) return;
    state = sanitizeVeri(snap.data());
    if (document.getElementById("uygulama").style.display !== "none") {
      if (!ui.acikTesis || ui.acikTesis.size === 0) ui.acikTesis.add(state.tesisler[0]?.id);
      render();
    }
  }, err => {
    console.error("Veri dinleme hatası:", err);
    toastGoster("Veri sunucusuna bağlanılamadı. İnternet bağlantınızı kontrol edin.", "hata");
  });
}
async function kullaniciRoluAyarla(user){
  mevcutKullanici = user;
  const ref = db.collection("kullanicilar").doc(user.uid);
  const snap = await ref.get();
  if (!snap.exists) {

function tarayiciAdi(){
  const ua = navigator.userAgent;
  if (ua.includes("Edg/")) return "Microsoft Edge";
  if (ua.includes("OPR/") || ua.includes("Opera")) return "Opera";
  if (ua.includes("Firefox/")) return "Firefox";
  if (ua.includes("Chrome/") && !ua.includes("Edg/")) return "Chrome";
  if (ua.includes("Safari/") && !ua.includes("Chrome/")) return "Safari";
  return "Bilinmeyen tarayıcı";
}

  const t = state.tesisler.find(x => x.id === tesisId);
  const secilenler = ui.stokBekleyenSecim[tesisId];
  if (!secilenler || secilenler.size === 0) { toastGoster("Lütfen stoğa eklenecek en az bir ürün seçin.", "hata"); return; }
  teyitIste("Stok Onayı", "Seçilen ürünleri stoğa eklemek üzeresiniz. Onaylamak için işlemi çözün:", () => stokBekleyenIsle(tesisId));
}
function stokBekleyenIsle(tesisId){
  const t = state.tesisler.find(x => x.id === tesisId);
  const secilenler = ui.stokBekleyenSecim[tesisId] || new Set();
  let depoId = ui.stokBekleyenDepo[tesisId];
  let depo = t.depolar.find(d => d.id === depoId);
  if (!depo) {
    depo = t.depolar.find(d => d.ad === "Genel Depo");
    if (!depo) { depo = { id: uid(), ad: "Genel Depo", urunler: [] }; t.depolar.push(depo); }
  }
  const bekleyenler = bekleyenStokKalemleri(t.ad);
  let sayac = 0;
  bekleyenler.forEach(b => {
    const anahtar = b.satId + "|" + b.kalemId;
    malzemeGecmisineEkle(b.urun);
    if (!secilenler.has(anahtar)) return;
    const sat = satinAlmaBul(b.satId); const k = sat?.kalemler.find(x => x.id === b.kalemId);
    if (!k) return;
    const adTemiz = (k.urun || "").trim();
    const mevcut = depo.urunler.find(u => u.ad.trim().toLowerCase() === adTemiz.toLowerCase());
    const miktar = parseFloat(k.miktar) || 0;
    if (mevcut) { mevcut.miktar = (parseFloat(mevcut.miktar) || 0) + miktar; }
    else { depo.urunler.push({ id: uid(), ad: adTemiz, miktar, birim: k.birim || "", kritikTakip: false, kritikEsik: 0 }); }
    k.stokaAktarildi = true;
    sayac++;
  });
  delete ui.stokBekleyenSecim[tesisId];
  kaydetIslem(`Stok onaylandı: ${sayac} ürün → ${t.ad} / ${depo.ad}`, { view: "stok" });
  toastGoster(`${sayac} ürün ${t.ad} / ${depo.ad} stoğuna eklendi.`, "basari");
  saveData(); render();
}

function miktarDegisimSinifi(urunId, yeniMiktar){
  const eski = stokOncekiMiktarlar[urunId];
  stokOncekiMiktarlar[urunId] = yeniMiktar;
  if (eski === undefined) return "";
  const e = parseFloat(eski) || 0, y = parseFloat(yeniMiktar) || 0;
  if (e === y) return "";
  return y > e ? "miktarYanipSonArtis" : "miktarYanipSonAzalis";
}
let ozetOnceki = { kritik: 0, satinAlma: 0, bakim: 0 };
function sayiSayarakYaz(elId, eskiDeger, yeniDeger, anahtar){
  const el = document.getElementById(elId);
  if (!el) return;
  if (eskiDeger === yeniDeger) { el.textContent = yeniDeger; ozetOnceki[anahtar] = yeniDeger; return; }
  const sure = 650, baslangic = performance.now();
  function adim(simdi){
    const ilerleme = Math.min(1, (simdi - baslangic) / sure);
    const kolay = 1 - Math.pow(1 - ilerleme, 3);
    el.textContent = Math.round(eskiDeger + (yeniDeger - eskiDeger) * kolay);
    if (ilerleme < 1) requestAnimationFrame(adim);
    else { el.textContent = yeniDeger; ozetOnceki[anahtar] = yeniDeger; }
  }
  requestAnimationFrame(adim);
}

function genelAramaSonuclariHesapla(q){
  const sonuc = [];
  erisilenTesisler().forEach(t => {
    if (t.ad.toLowerCase().includes(q)) sonuc.push({ tip: "Tesis", baslik: t.ad, alt: "", hedef: { view: "tesis-vurgula", tesisId: t.id } });
    (t.makineler || []).forEach(m => {
      if (m.ad.toLowerCase().includes(q)) sonuc.push({ tip: "Makine", baslik: m.ad, alt: t.ad, hedef: { view: "tesis-vurgula", tesisId: t.id, makineId: m.id } });
      (m.pompalar || []).forEach(p => {
        if (p.ad.toLowerCase().includes(q)) sonuc.push({ tip: "Pompa", baslik: p.ad, alt: `${t.ad} / ${m.ad}`, hedef: { view: "pompa", tesisId: t.id, makineId: m.id, pompaId: p.id } });
        (p.parcalar || []).forEach(pr => {
          if ((pr.ad||"").toLowerCase().includes(q) || (pr.malzeme||"").toLowerCase().includes(q)) sonuc.push({ tip: "Parça", baslik: pr.ad || "(isimsiz)", alt: `${p.ad} — ${t.ad}/${m.ad}`, hedef: { view: "pompa", tesisId: t.id, makineId: m.id, pompaId: p.id } });
        });
        (p.gecmis || []).forEach(g => {
          if ((g.aciklama||"").toLowerCase().includes(q)) sonuc.push({ tip: "Rapor/Geçmiş", baslik: g.aciklama, alt: `${p.ad} — ${t.ad}/${m.ad} · ${g.tarih}`, hedef: { view: "pompa", tesisId: t.id, makineId: m.id, pompaId: p.id } });
        });
      });
      (m.bakimlar || []).forEach(b => {
        if ((b.ad||"").toLowerCase().includes(q)) sonuc.push({ tip: "Bakım Planı", baslik: b.ad, alt: `${t.ad} / ${m.ad}`, hedef: { view: "bakim", tesisId: t.id, makineId: m.id } });
      });
    });
    (t.depolar || []).forEach(d => {
      if (d.ad.toLowerCase().includes(q)) sonuc.push({ tip: "Depo", baslik: d.ad, alt: t.ad, hedef: { view: "stok", tesisId: t.id, depoId: d.id } });
      (d.urunler || []).forEach(u => {
        if ((u.ad||"").toLowerCase().includes(q)) sonuc.push({ tip: "Stok Ürünü", baslik: u.ad, alt: `${d.ad} — ${t.ad}`, hedef: { view: "stok", tesisId: t.id, depoId: d.id } });
      });
    });
  });
  state.satinAlmalar.forEach(sat => {
    (sat.kalemler || []).forEach(k => {
      if ((k.urun||"").toLowerCase().includes(q)) sonuc.push({ tip: "Satın Alma", baslik: k.urun, alt: sat.siparisNo ? `Sipariş No: ${sat.siparisNo}` : "", hedef: { view: "satinalma-detay", satId: sat.id } });
    });
    if ((sat.siparisNo||"").toLowerCase().includes(q)) sonuc.push({ tip: "Satın Alma", baslik: `Sipariş No: ${sat.siparisNo}`, alt: "", hedef: { view: "satinalma-detay", satId: sat.id } });
  });
  (state.malzemeGecmisi || []).forEach(m => {
    if (m.ad.toLowerCase().includes(q)) sonuc.push({ tip: "Malzeme", baslik: m.ad, alt: "Kullanılan Malzemeler listesi", hedef: { view: "malzemeler" } });
  });
  return sonuc.slice(0, 40);
}
function genelAramaSonucRender(){
  const kap = document.getElementById("genelAramaSonuclari");
  if (!kap) return;
  const q = (ui.genelArama || "").trim().toLowerCase();
  if (!q) { kap.innerHTML = ""; aramaHedefleri = []; return; }
  const sonuclar = genelAramaSonuclariHesapla(q);
  aramaHedefleri = sonuclar.map(s => s.hedef);
  let h = "";
  if (sonuclar.length === 0) {
    h = `<div class="bosMetin" style="padding:14px">Sonuç bulunamadı.</div>`;
  } else {
    sonuclar.forEach((s, i) => {
      h += `<div class="aramaSonucSatiri ty-btn" onclick="aramaSonucunaGit(${i})">
        <span class="aramaTip">${esc(s.tip)}</span>
        <span style="flex:1;min-width:0">
          <div style="color:var(--yazi);font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(s.baslik)}</div>
          ${s.alt ? `<div style="color:var(--yazi-soluk);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(s.alt)}</div>` : ''}
        </span>
      </div>`;
    });
  }
  kap.innerHTML = h;
}

    });
    (m.pompalar || []).forEach(p => (p.bakimlar || []).forEach(b => {
      if (!b.ad) return;
      sonuc.push({ tesisId: t.id, makineId: m.id, pompaId: p.id, tesis: t.ad, makine: m.ad, pompa: p.ad, bakim: b, durum: bakimDurum(b) });
    }));
  }));
  return sonuc;
}
function bakimUyariSayisi(){
  return tumBakimlar().filter(x => x.durum.durum === "gecti" || x.durum.durum === "yaklasiyor").length;
}
function bakimUyariTesisAdlari(){
  const gectiAdlari = new Set(), yaklasanAdlari = new Set();
  tumBakimlar().forEach(x => {
    if (x.durum.durum === "gecti") gectiAdlari.add(x.tesis);
    else if (x.durum.durum === "yaklasiyor") yaklasanAdlari.add(x.tesis);
  });
  return { gecti: [...gectiAdlari], yaklasan: [...yaklasanAdlari] };
}

function erisilenTesisler(){

/* ---------------- kişiye özel sıralama (localStorage) ---------------- */
function siraOku(){
  try { const v = JSON.parse(localStorage.getItem("tys_sira") || "null"); return v && v.tesisler ? v : { tesisler: [], makineler: {} }; }
  catch(e){ return { tesisler: [], makineler: {} }; }
}
function siraYaz(sira){ try { localStorage.setItem("tys_sira", JSON.stringify(sira)); } catch(e){} }
function siraliListe(idler, kayitliSira){
  const kayitliVarOlanlar = (kayitliSira || []).filter(id => idler.includes(id));
  const eksikler = idler.filter(id => !kayitliVarOlanlar.includes(id));
  return [...kayitliVarOlanlar, ...eksikler];
}
function siraliTesisler(){
  const sira = siraOku();
  const idler = erisilenTesisler().map(t => t.id);
  const idSirasi = siraliListe(idler, sira.tesisler);
  const harita = {}; state.tesisler.forEach(t => harita[t.id] = t);
  return idSirasi.map(id => harita[id]).filter(Boolean);
}
function siraliMakineler(tesisId, makineler){
  const sira = siraOku();
  const idler = makineler.map(m => m.id);
  const idSirasi = siraliListe(idler, sira.makineler ? sira.makineler[tesisId] : []);
  const harita = {}; makineler.forEach(m => harita[m.id] = m);
  return idSirasi.map(id => harita[id]).filter(Boolean);
}
function siralamaModuAcKapat(){ ui.siralaModu = !ui.siralaModu; render(); }
function tesisTasi(tesisId, yon){
  const sira = siraOku();
  const liste = siraliListe(erisilenTesisler().map(t => t.id), sira.tesisler);
  const i = liste.indexOf(tesisId), j = i + yon;
  if (i < 0 || j < 0 || j >= liste.length) return;
  [liste[i], liste[j]] = [liste[j], liste[i]];
  sira.tesisler = liste;
  siraYaz(sira); render();
}
function makineTasi(tesisId, makineId, yon){
  const t = state.tesisler.find(x => x.id === tesisId); if (!t) return;
  const sira = siraOku();
  if (!sira.makineler) sira.makineler = {};
  const liste = siraliListe(t.makineler.map(m => m.id), sira.makineler[tesisId]);
  const i = liste.indexOf(makineId), j = i + yon;
  if (i < 0 || j < 0 || j >= liste.length) return;
  [liste[i], liste[j]] = [liste[j], liste[i]];
  sira.makineler[tesisId] = liste;
  siraYaz(sira); render();
}

function girisGonder(){
  const eposta = document.getElementById("girisEposta").value.trim();
  const sifre = document.getElementById("girisSifre").value;
  const hataEl = document.getElementById("girisHataMetni");
  hataEl.textContent = "";

  const btn = document.getElementById("girisButonu");
  btn.textContent = "Giriş yapılıyor..."; btn.disabled = true;
  auth.signInWithEmailAndPassword(eposta, sifre)
    .catch(err => {
      btn.textContent = "Giriş yap"; btn.disabled = false;
      if (err.code === "auth/invalid-credential" || err.code === "auth/wrong-password" || err.code === "auth/user-not-found") {
        hataEl.textContent = "E-posta veya şifre hatalı.";
      } else if (err.code === "auth/invalid-email") {
        hataEl.textContent = "Geçerli bir e-posta adresi girin.";
      } else if (err.code === "auth/too-many-requests") {
        hataEl.textContent = "Çok fazla deneme yapıldı. Biraz sonra tekrar deneyin.";
      } else {
        hataEl.textContent = "Giriş yapılamadı: " + err.message;

    });

function saKalemDurumDegistir(satId, kalemId){
  const s = satinAlmaBul(satId); const k = s.kalemler.find(x => x.id === kalemId); if (!k) return;
  if (k.stokaAktarildi) { toastGoster("Bu ürün zaten stoğa eklendi, durumu değiştirilemez.", "hata"); return; }
  k.durum = k.durum === "Geldi" ? "Gelmedi" : "Geldi";
  saveData(); render();
}
/* kullanıldığı yer satırları */
function saYerEkle(satId){
  const s = satinAlmaBul(satId); s.yerler.push(bosYer()); saveData(); render();
}
function saYerSil(satId, yerId){
  const s = satinAlmaBul(satId); s.yerler = s.yerler.filter(x => x.id !== yerId);
  if (s.yerler.length === 0) s.yerler.push(bosYer());
  saveData(); render();
}
function saYerGuncelle(satId, yerId, deger){
  const s = satinAlmaBul(satId); const y = s.yerler.find(x => x.id === yerId); if (y) y.ad = deger;
  saveData(); render();
}

function saTumKalemler(){
  return state.satinAlmalar.flatMap(s => s.kalemler.map(k => ({ ...k, satId: s.id })));
}
function saDurumFiltreDegistir(f){ ui.saFiltre = f; render(); }
function saFiltreliListe(){
  const q = (ui.saArama || "").trim().toLowerCase();
  let liste = state.satinAlmalar;
  if (q) {
    liste = liste.filter(s =>
      [s.siparisNo, s.firma,
       ...(s.kalemler || []).map(k => k.urun),
       ...(s.yerler || []).map(y => y.ad)]
        .some(alan => (alan || "").toLowerCase().includes(q))
    );
  }
  if (ui.saFiltre === "gelen") {
    liste = liste.filter(s => s.kalemler.length > 0 && s.kalemler.every(k => k.durum === "Geldi"));
  } else if (ui.saFiltre === "gelmeyen") {
    liste = liste.filter(s => s.kalemler.some(k => k.durum === "Gelmedi"));
  }
  return liste;
}
function saListesiRender(){
  const kap = document.getElementById("saListesiKapsayici");
  if (!kap) return;
  const liste = saFiltreliListe();
  let h = `<div class="tabloSarici">`;
  if (liste.length === 0) {
    h += `<div class="bosMetin" style="padding:16px">${state.satinAlmalar.length===0 ? "Henüz satın alma kaydı yok. \"+ satın alma ekle\" ile başlayın." : "Aramanla eşleşen bir kayıt bulunamadı."}</div>`;
  } else {
    liste.forEach(sat => {
      const urunler = (sat.kalemler || []).map(k => k.urun).filter(Boolean);
      const gelenSayi = (sat.kalemler || []).filter(k => k.durum === "Geldi").length;
      const toplam = (sat.kalemler || []).length;
      const yerMetni = (sat.yerler || []).map(y => y.ad).filter(Boolean).join(", ");
      const renk = gelenSayi === toplam ? durumRenk.Geldi : durumRenk.Gelmedi;
      const renkRgb = gelenSayi === toplam ? durumRenkRgb.Geldi : durumRenkRgb.Gelmedi;
      h += `<div class="saListeSatir ty-satir" onclick="satinAlmaSec('${sat.id}')">
        <div style="flex:1;min-width:0">
          <div class="saListeUrun">${esc(urunler.slice(0,3).join(", ")) || "(ürün adı girilmedi)"}${urunler.length>3?` <span style="color:var(--yazi-soluk)">+${urunler.length-3} diğer</span>`:''}</div>
          <div class="saListeAltBilgi">${[sat.siparisNo && ('Sipariş No: '+sat.siparisNo), yerMetni].filter(Boolean).map(esc).join(' · ') || '—'}</div>
        </div>
        <span class="rozetDurum" style="color:${renk};border-color:rgba(${renkRgb},0.33);background:rgba(${renkRgb},0.1)">${gelenSayi}/${toplam} geldi</span>
      </div>`;
    });
  }
  h += `</div>`;
  kap.innerHTML = h;
}

/* ---------------- yedekleme ---------------- */
function disaAktar(){
  const veri = { ...state, olusturma: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(veri, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `tesis-yedek-${bugun().replaceAll(".", "-")}.json`; a.click();
  URL.revokeObjectURL(url);
}
function iceAktar(dosya){
  if (!dosya) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const veri = JSON.parse(reader.result);
      if (veri.tesisler) state.tesisler = veri.tesisler;
      if (veri.satinAlmalar) state.satinAlmalar = veri.satinAlmalar;
      toastGoster("Yedek başarıyla geri yüklendi.", "basari");
      saveData(); render();
    } catch(e){ toastGoster("Yedek dosyası okunamadı. Geçerli bir JSON dosyası seçin.", "hata"); }
  };
  reader.readAsText(dosya);
}

const durumRenk = { Geldi: "var(--yesil)", Gelmedi: "var(--kirmizi2)" };
const durumRenkRgb = { Geldi: "var(--yesil-rgb)", Gelmedi: "var(--kirmizi2-rgb)" };

function render(){ renderSol(); renderAna(); renderSag(); guncelleMalzemeListesi(); }
function islemBadge(aciklama){
  const a = (aciklama || "").toLowerCase();
  if (a.includes("silindi")) return { etiket: "Silme", renk: "var(--kirmizi)", renkRgb: "var(--kirmizi-rgb)" };
  if (a.includes("onayland")) return { etiket: "Onay", renk: "var(--yesil)", renkRgb: "var(--yesil-rgb)" };
  if (a.includes("bakım yapıldı")) return { etiket: "Bakım", renk: "var(--yesil)", renkRgb: "var(--yesil-rgb)" };
  if (a.includes("rapor eklendi")) return { etiket: "Rapor", renk: "var(--vurgu)", renkRgb: "var(--vurgu-rgb)" };
  if (a.includes("satın alma")) return { etiket: "Satın Alma", renk: "var(--mavi)", renkRgb: "var(--mavi-rgb)" };
  if (a.includes("eklendi") || a.includes("oluşturuldu")) return { etiket: "Ekleme", renk: "var(--vurgu)", renkRgb: "var(--vurgu-rgb)" };
  return { etiket: "İşlem", renk: "var(--yazi-soluk)", renkRgb: "139,150,168" };
}
function renderSag(){
  const el = document.getElementById("sagMenu");
  if (!el) return;
  const liste = (state.sonIslemler || []).slice(0, 10);
  let h = `<div class="solBaslikSatir" style="padding-top:6px"><span class="solBaslik">Son İşlemler</span></div>`;
  if (liste.length === 0) {
    h += `<div class="bosMetin" style="padding:14px">Henüz bir işlem yapılmadı.</div>`;
  } else {
    liste.forEach(islem => {
      const rozet = islemBadge(islem.aciklama);
      h += `<div class="islemSatir ty-node" onclick="islemeGitById('${islem.id}')">
        <span class="islemRozet" style="color:${rozet.renk};background:rgba(${rozet.renkRgb},0.12);border-color:rgba(${rozet.renkRgb},0.4)">${rozet.etiket}</span>
        <div class="islemAciklama">${esc(islem.aciklama)}</div>
        <div class="islemZaman">${esc(islem.tarih)} · ${esc(islem.saat)}</div>
      </div>`;
    });
  }
  el.innerHTML = h;
}
function guncelleMalzemeListesi(){
  const dl = document.getElementById("malzemeListesi");

function duzenlemeBaslat(id){ ui.duzenlenenId = id; render(); }
function duzenlemeIptal(){ ui.duzenlenenId = null; render(); }
function tesisAdKaydet(inputEl, tesisId){
  const t = state.tesisler.find(x => x.id === tesisId);
  if (t && inputEl.value.trim()) t.ad = inputEl.value.trim();
  ui.duzenlenenId = null; saveData(); render();
}
function makineAdKaydet(inputEl, tesisId, makineId){
  const t = state.tesisler.find(x => x.id === tesisId);
  const m = t.makineler.find(x => x.id === makineId);
  if (m && inputEl.value.trim()) m.ad = inputEl.value.trim();
  ui.duzenlenenId = null; saveData(); render();
}
function pompaAdKaydetSol(inputEl, tesisId, makineId, pompaId){
  const t = state.tesisler.find(x => x.id === tesisId);
  const m = t.makineler.find(x => x.id === makineId);
  const p = m.pompalar.find(x => x.id === pompaId);
  if (p && inputEl.value.trim()) p.ad = inputEl.value.trim();
  ui.duzenlenenId = null; saveData(); render();
}
function enterIleKaydet(e){ if (e.key === "Enter") e.target.blur(); if (e.key === "Escape") { ui.duzenlenenId = null; render(); } }

function renderSol(){
  const kritikTesisler = kritikTesisAdlari();
  let h = `
    <div class="satinAlmaNav ${ui.view==='anasayfa'?'satinAlmaNavAktif':''} ty-btn" onclick="anaSayfaGoster()">
      <span>🏠 Ana Sayfa</span>

      <span>📦 Stok Listesi</span>
    </div>`;

    const metin = `⚠ Kritik stok: ${kritikTesisler.join(' • ')}`;
    h += `<div class="kritikMarquee"><div class="kritikMarqueeIc">${esc(metin)} &nbsp;&nbsp;•&nbsp;&nbsp; ${esc(metin)}</div></div>`;
  }
  h += `
    <div class="satinAlmaNav ${(ui.view==='satinalma'||ui.view==='satinalma-detay')?'satinAlmaNavAktif':''} ty-btn" onclick="satinAlmaGoster()">

    </div>`;
  {
    const bakimTesisleri = bakimUyariTesisAdlari();
    if (bakimTesisleri.gecti.length > 0 || bakimTesisleri.yaklasan.length > 0) {
      const parcalar = [];
      if (bakimTesisleri.gecti.length) parcalar.push(`⚠ Bakımı geçen: ${bakimTesisleri.gecti.join(' • ')}`);
      if (bakimTesisleri.yaklasan.length) parcalar.push(`⏳ Bakımı yaklaşan: ${bakimTesisleri.yaklasan.join(' • ')}`);

      h += `<div class="kritikMarquee"><div class="kritikMarqueeIc">${esc(metin)} &nbsp;&nbsp;•&nbsp;&nbsp; ${esc(metin)}</div></div>`;

        ${adminMi() ? `<button class="ekleMini ty-btn" onclick="tesisEkle()">+ Tesis ekle</button>` : ''}
      </div>
    </div>`;

  const tesisListesi = siraliTesisler();
  tesisListesi.forEach((t, tIndex) => {
    const acikT = ui.acikTesis.has(t.id);
    h += `<div class="tesisKart">`;
    h += `<div class="tesisBaslikSatir" onclick="acikTesisToggle('${t.id}')">
      <span class="okBuyuk" style="transform:${acikT?'rotate(90deg)':'none'}">›</span>
      <span class="tesisIkon">🏭</span>`;
    if (ui.duzenlenenId === t.id) {
      h += `<input class="editInput" id="editInput_${t.id}" value="${esc(t.ad)}" onclick="event.stopPropagation()" onkeydown="enterIleKaydet(event)" onblur="tesisAdKaydet(this,'${t.id}')" />`;
    } else {
      h += `<span class="tesisAdMetin">${esc(t.ad)}</span>`;

    h += `<div class="aksiyonGrup">
        ${ui.siralaModu ? `

  if (ui.duzenlenenId) {

          ${urunKritikMi(k.urun) ? `<span class="kritikSolukNokta" title="Bu ürün kritik stokta">●</span>` : ''}
          ${ui.saDuzenle ? `
            <input class="parcaGirdi" style="flex:2" list="malzemeListesi" placeholder="Ürün adı" value="${esc(k.urun)}" onchange="saKalemGuncelle('${sat.id}','${k.id}','urun',this.value)" />
            <input class="parcaGirdi" style="flex:1" placeholder="Miktar" value="${esc(k.miktar)}" onchange="saKalemGuncelle('${sat.id}','${k.id}','miktar',this.value)" />
            <input class="parcaGirdi" style="flex:1" placeholder="Birim" value="${esc(k.birim)}" onchange="saKalemGuncelle('${sat.id}','${k.id}','birim',this.value)" />
            <input class="parcaGirdi" style="width:120px;flex:none" placeholder="gg.aa.yyyy" value="${esc(k.teslimTarihi)}" onchange="saKalemGuncelle('${sat.id}','${k.id}','teslimTarihi',this.value)" />
          ` : `
            <span style="flex:2;color:var(--yazi)">${esc(k.urun) || '—'}</span>
            <span style="flex:1;color:var(--yazi-dim)">${esc(k.miktar) || '—'}</span>
            <span style="flex:1;color:var(--yazi-dim)">${esc(k.birim) || '—'}</span>
            <span style="width:120px;color:var(--yazi-dim);font-family:'IBM Plex Mono',monospace">${esc(k.teslimTarihi) || '—'}</span>
          `}
          <button class="ty-btn" style="width:90px;flex:none;background:rgba(${durumRenkRgb[k.durum]},0.1);color:${durumRenk[k.durum]};font-weight:600;border:1px solid rgba(${durumRenkRgb[k.durum]},0.33);border-radius:6px;padding:6px 0;font-size:11.5px;${k.stokaAktarildi?'cursor:not-allowed;opacity:0.6':''}" title="${k.stokaAktarildi?'Bu ürün stoğa eklendi, durum kilitli':''}" onclick="saKalemDurumDegistir('${sat.id}','${k.id}')">${k.durum}${k.stokaAktarildi?' 🔒':''}</button>
          ${ui.saDuzenle ? `<span class="silIkon" style="width:20px" onclick="silOnayla('Ürünü Sil', ()=>saKalemSil('${sat.id}','${k.id}'))">×</span>` : `<span style="width:20px"></span>`}
        </div>`).join('')}
    </div>`;

    h += `<div class="kart">
      <div class="kartBaslikSatir">
        <span class="kartBaslik">Kullanıldığı Yer</span>
        ${ui.saDuzenle?`<button class="ekleMini ty-btn" onclick="saYerEkle('${sat.id}')">+ satır ekle</button>`:''}
      </div>
      ${sat.yerler.map((y, i) => `
        <div class="kalemSatir">
          <span class="kalemNo">${i+1}</span>
          ${ui.saDuzenle
            ? `<select class="parcaGirdi" style="flex:1" onchange="saYerGuncelle('${sat.id}','${y.id}',this.value)">
                 <option value="">— tesis seç —</option>
                 ${erisilenTesisler().map(t => `<option value="${esc(t.ad)}" ${t.ad===y.ad?'selected':''}>${esc(t.ad)}</option>`).join('')}
               </select>
               <span class="silIkon" style="width:20px" onclick="silOnayla('Satırı Sil', ()=>saYerSil('${sat.id}','${y.id}'))">×</span>`
            : `<span style="flex:1;color:var(--yazi-ikincil)">${esc(y.ad) || '—'}</span>`}
        </div>`).join('')}
    </div>`;

    h += `<div class="kart">
      <div class="kartBaslik" style="margin-bottom:12px">Sipariş Bilgileri</div>
      <div>${baslikAlan('Sipariş Edilmesi İstenen Firma / Firmalar', 'firma')}</div>
    </div>`;

    h += `<div class="bosMetin">Kayıt zamanı: ${esc(sat.eklenmeTarihi)} ${esc(sat.eklenmeSaati)}</div>`;

    anaPanelYaz(h);
  }
}
</script>
</body>
</html>
