  *, *::before, *::after { transition: background-color .5s ease, color .5s ease, border-color .5s ease; }

  .modalSoru { font-size: 20px; font-weight: 600; color: var(--vurgu); font-family: 'IBM Plex Mono', monospace; margin-bottom: 12px; text-align: center; background: var(--bg); border: 1px solid var(--sinir); border-radius: 8px; padding: 10px; }

  .beklemeBanner {

  .kritikToggleBtn { flex-shrink: 0; white-space: nowrap; background: transparent; color: var(--yazi-soluk); border: 1px solid var(--sinir2); border-radius: 6px; padding: 8px 14px; font-size: 12px; font-weight: 600; }
  .kritikToggleAktif { background: rgba(var(--kirmizi-rgb),0.10); color: var(--kirmizi); border-color: rgba(var(--kirmizi-rgb),0.33); }
  .kritikSolukNokta { color: rgba(var(--kirmizi-rgb),0.40); font-size: 9px; flex-shrink: 0; margin-right: -4px; }

  .kritikMarquee { overflow: hidden; white-space: nowrap; margin: 0 12px 14px; border: 1px solid rgba(var(--kirmizi-rgb),0.30); background: rgba(var(--kirmizi-rgb),0.08); border-radius: 8px; padding: 8px 0; }
  .kritikMarqueeIc { display: inline-block; padding-left: 100%; animation: kritikKaydir 14s linear infinite; color: var(--kirmizi); font-size: 11.5px; font-weight: 600; }
  @keyframes kritikKaydir { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }
  .eklePrimer { background: var(--vurgu); color: var(--vurgu-uzeri-yazi); border: none; border-radius: 6px; padding: 8px 14px; font-size: 12.5px; font-weight: 600; }
  .bilgiKutu { background: var(--bg-yuzey2); border: 1px solid var(--sinir2); border-radius: 6px; padding: 9px 12px; font-size: 12.5px; color: var(--yazi-dim2); margin-bottom: 14px; }
  .tabloSarici { background: var(--bg-yuzey); border: 1px solid var(--sinir); border-radius: 10px; overflow: hidden; }
  .tabloBaslikSatir { display: flex; gap: 10px; padding: 10px 14px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--yazi-soluk); border-bottom: 1px solid var(--sinir); }
  .tabloSatir { display: flex; gap: 10px; padding: 7px 14px; align-items: center; border-bottom: 1px solid var(--bg-satir-sinir); }
  .tabloGirdi { background: transparent; border: 1px solid transparent; border-radius: 5px; color: var(--yazi-ikincil2); padding: 6px 8px; font-size: 12.5px; min-width: 0; }
</style>
</head>
<body>

<!-- ================= FIREBASE SDK ================= -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<!-- ================= GİRİŞ EKRANI ================= -->
<div id="girisEkrani" style="height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);">
  <div class="girisKart">
    <div class="girisLogo">⌁</div>
    <div class="girisBaslik">Giriş yap</div>
    <div class="girisAlt">Tesis Yönetim Sistemi</div>

    <label class="girisAlan">E-posta</label>
    <input class="girisInput" id="girisEposta" type="email" autocomplete="username" />

    <label class="girisAlan">Şifre</label>
    <input class="girisInput" id="girisSifre" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter'){event.preventDefault();girisGonder();}" />

    <button class="girisBtn ty-btn" id="girisButonu" onclick="girisGonder()">Giriş yap</button>

</div>

<!-- ================= UYGULAMA ================= -->
<div id="uygulama" style="display:none;">
  <div class="ustCubuk">
    <div style="display:flex;align-items:baseline;gap:10px;">
      <span class="logo">⌁</span>
      <div>
        <div class="baslik">Tesis Yönetim Sistemi</div>
        <div class="altBaslik" id="ustAltYazi">saha ekipman ve satın alma takibi</div>
      </div>
      <button class="lambaBtn ty-btn" id="lambaBtn" onclick="lambaTikla()" title="Temayı değiştir">💡</button>
    </div>
    <div style="display:flex;gap:8px;align-items:center;">
      <span class="kullaniciRozeti" id="kullaniciRozeti"></span>
      <button class="ustBtn ty-btn" onclick="malzemeListesiGoster()">Kullanılan Malzemeler</button>
      <button class="ustBtn ty-btn" onclick="disaAktar()">Yedekle (dışa aktar)</button>
      <button class="ustBtn ty-btn" id="yedekYukleBtn" onclick="document.getElementById('yedekInput').click()">Yedek yükle</button>
      <button class="ustBtn ty-btn" onclick="ayarlarGoster()">⚙ Ayarlar</button>
      <button class="ustBtn ty-btn" onclick="cikisYap()">Çıkış yap</button>
      <input id="yedekInput" type="file" accept=".json" style="display:none" onchange="iceAktar(this.files[0])" />
    </div>

  <div class="govde">
    <div class="sol" id="solMenu"></div>
    <div class="ana" id="anaPanel"></div>
    <div class="sag" id="sagMenu"></div>
  </div>
</div>
<datalist id="malzemeListesi"></datalist>

<div id="teyitModal" class="modalOverlay" style="display:none">
  <div class="modalKutu">
    <div class="modalBaslik" id="teyitBaslik"></div>
    <div class="modalMetin" id="teyitMetin"></div>
    <div class="modalSoru" id="teyitSoru"></div>
    <input class="girdi" id="teyitGirdi" type="number" placeholder="Cevap" onkeydown="if(event.key==='Enter'){event.preventDefault();teyitOnayla();}" />
    <div class="modalHata" id="teyitHata"></div>
    <div class="modalBtnSatir">
      <button class="ustBtn ty-btn" onclick="teyitIptal()">Vazgeç</button>
      <button class="eklePrimer ty-btn" id="teyitOnayBtn" onclick="teyitOnayla()">Onayla</button>
    </div>
  </div>
</div>

<script>
/* ---------------- yardımcılar ---------------- */
const uid = () => Math.random().toString(36).slice(2, 10);

/* ---------------- genel onay modalı (silme / stok onayı) ---------------- */
let teyitState = null;
function teyitIste(baslik, aciklama, geriCagirFn){
  const a = Math.floor(Math.random() * 8) + 2;
  const b = Math.floor(Math.random() * 8) + 2;
  teyitState = { cevap: a + b, fn: geriCagirFn };
  document.getElementById("teyitBaslik").textContent = baslik;
  document.getElementById("teyitMetin").textContent = aciklama;
  document.getElementById("teyitSoru").textContent = `${a} + ${b} = ?`;
  document.getElementById("teyitGirdi").value = "";
  document.getElementById("teyitHata").textContent = "";
  document.getElementById("teyitModal").style.display = "flex";
  setTimeout(() => document.getElementById("teyitGirdi").focus(), 50);
}
function teyitIptal(){
  document.getElementById("teyitModal").style.display = "none";
  teyitState = null;
}
function teyitOnayla(){
  const girdi = document.getElementById("teyitGirdi");
  const deger = parseInt(girdi.value, 10);
  if (teyitState && deger === teyitState.cevap) {
    const fn = teyitState.fn;
    document.getElementById("teyitModal").style.display = "none";
    teyitState = null;
    fn();
  } else {
    document.getElementById("teyitHata").textContent = "Yanlış cevap, tekrar deneyin.";
    girdi.value = ""; girdi.focus();
  }
}
function silOnayla(baslik, geriCagirFn){
  teyitIste(baslik, "Bu kaydı silmek üzeresiniz. Onaylamak için işlemi çözün:", geriCagirFn);
}
const bugun = () => {
  const d = new Date(); const p = n => String(n).padStart(2, "0");
  return `${p(d.getDate())}.${p(d.getMonth()+1)}.${d.getFullYear()}`;
};
const suAn = () => {
  const d = new Date(); const p = n => String(n).padStart(2, "0");
  return `${p(d.getHours())}:${p(d.getMinutes())}`;
};
function esc(str){ return (str ?? "").toString().replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
function tarihAyristir(str){
  if (!str) return null;
  const parcalar = str.split(".");
  if (parcalar.length !== 3) return null;
  const [g, a, y] = parcalar.map(x => parseInt(x, 10));
  if (!g || !a || !y) return null;
  const d = new Date(y, a - 1, g);
  return isNaN(d.getTime()) ? null : d;
}
function tarihFormatla(d){
  const p = n => String(n).padStart(2, "0");
  return `${p(d.getDate())}.${p(d.getMonth()+1)}.${d.getFullYear()}`;
}
function gunFarki(d1, d2){ return Math.round((d2 - d1) / (1000*60*60*24)); }

function ornekPompa(ad){
  return { id: uid(), ad, parcalar: [], gecmis: [{ id: uid(), tarih: bugun(), aciklama: "Kayıt oluşturuldu." }] };
}
function varsayilanVeri(){
  return {
    tesisler: Array.from({length:6}).map((_,i)=>({
      id: uid(), ad: `Tesis ${i+1}`,
      makineler: [{ id: uid(), ad: "Pompa İstasyonu", pompalar: [ornekPompa("1. Pompa"), ornekPompa("2. Pompa")], bakimlar: [] }],
      depolar: []
    })),
    satinAlmalar: [],
    malzemeGecmisi: [],
    sonIslemler: []
  };
}

/* ---------------- durum ---------------- */
let state = null;
let ui = { view: "anasayfa", secim: {}, acikTesis: new Set(), acikMakine: new Set(), acikGecmis: new Set(), duzenle: false, mesaj: "", saSecim: null, saDuzenle: false, saArama: "", saFiltre: "tumu", stokAcikTesis: new Set(), stokAcikDepo: new Set(), stokDuzenle: false, stokBekleyenAcik: new Set(), stokBekleyenSecim: {}, stokBekleyenDepo: {}, bakimAcikTesis: new Set(), bakimAcikMakine: new Set() };

function sanitizeVeri(v){
  if (!v) v = varsayilanVeri();
  if (!v.tesisler) v.tesisler = varsayilanVeri().tesisler;
  if (!v.malzemeGecmisi) v.malzemeGecmisi = [];
  v.malzemeGecmisi = v.malzemeGecmisi.map(x => typeof x === "string" ? { id: uid(), ad: x } : x);
  if (!v.satinAlmalar) v.satinAlmalar = [];
  if (!v.sonIslemler) v.sonIslemler = [];
  v.tesisler.forEach(t => {
    if (!Array.isArray(t.depolar)) t.depolar = [];
    (t.makineler || []).forEach(m => { if (!Array.isArray(m.bakimlar)) m.bakimlar = []; });
  });
  v.satinAlmalar = v.satinAlmalar.map(s => {
    if (Array.isArray(s.kalemler)) return s;
    return {
      id: s.id, siparisNo: s.siparisNo || "", gelisTarihi: s.gelisTarihi || bugun(),
      kalemler: [{ id: uid(), urun: s.urun || "", miktar: s.miktar || "", birim: s.birim || "", teslimTarihi: s.teslimTarihi || "", durum: s.durum || "Gelmedi" }],
      yerler: s.kullanildigiYer ? [{ id: uid(), ad: s.kullanildigiYer }] : [{ id: uid(), ad: "" }],
      firma: s.firma || "",
      eklenmeTarihi: s.eklenmeTarihi || bugun(), eklenmeSaati: s.eklenmeSaati || suAn()
    };
  });
  return v;
}

/* ---------------- Firebase / Firestore ---------------- */
const firebaseConfig = {
  apiKey: "AIzaSyC5Jh7at2UmUrNnksDv2jDy5aonh_M3eA4",
  authDomain: "tesis-yonetim-d7502.firebaseapp.com",
  projectId: "tesis-yonetim-d7502",
  storageBucket: "tesis-yonetim-d7502.firebasestorage.app",
  messagingSenderId: "540630226337",
  appId: "1:540630226337:web:f1f48b6eab8c92b11127e0"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const veriRef = db.collection("veri").doc("ana");

let mevcutKullanici = null;
let mevcutRol = "personel";
let dinleyiciBaslatildi = false;

function adminMi(){ return mevcutRol === "yonetici"; }

function saveData(){
  if (!state) return;
  veriRef.set(state).catch(err => console.error("Kaydetme hatası:", err));
}
function veriDinlemeyeBasla(){
  if (dinleyiciBaslatildi) return;
  dinleyiciBaslatildi = true;
  veriRef.get().then(snap => {
    if (!snap.exists) { veriRef.set(varsayilanVeri()); }
  });
  veriRef.onSnapshot(snap => {
    if (!snap.exists) return;
    state = sanitizeVeri(snap.data());
    if (document.getElementById("uygulama").style.display !== "none") {
      if (!ui.acikTesis || ui.acikTesis.size === 0) ui.acikTesis.add(state.tesisler[0]?.id);
      render();
    }
  }, err => {
    console.error("Veri dinleme hatası:", err);
    ui.mesaj = "Veri sunucusuna bağlanılamadı. İnternet bağlantınızı kontrol edin.";
  });
}
async function kullaniciRoluAyarla(user){
  mevcutKullanici = user;
  const ref = db.collection("kullanicilar").doc(user.uid);
  const snap = await ref.get();
  if (!snap.exists) {
    const hepsi = await db.collection("kullanicilar").get();
    mevcutRol = hepsi.empty ? "yonetici" : "personel";
    await ref.set({ eposta: user.email, rol: mevcutRol });
  } else {
    mevcutRol = snap.data().rol || "personel";
  }
}
function tarayiciAdi(){
  const ua = navigator.userAgent;
  if (ua.includes("Edg/")) return "Microsoft Edge";
  if (ua.includes("OPR/") || ua.includes("Opera")) return "Opera";
  if (ua.includes("Firefox/")) return "Firefox";
  if (ua.includes("Chrome/") && !ua.includes("Edg/")) return "Chrome";
  if (ua.includes("Safari/") && !ua.includes("Chrome/")) return "Safari";
  return "Bilinmeyen tarayıcı";
}
async function girisKaydiTut(user){
  const bilgi = { sonGirisTarihi: bugun(), sonGirisSaati: suAn(), tarayici: tarayiciAdi() };
  try {
    const yanit = await fetch("https://api.ipify.org?format=json");
    const veri = await yanit.json();
    bilgi.sonGirisIp = veri.ip || "bilinmiyor";
  } catch(e) {
    bilgi.sonGirisIp = "alınamadı";
  }
  db.collection("kullanicilar").doc(user.uid).set(bilgi, { merge: true }).catch(err => console.error(err));
}
function malzemeGecmisineEkle(ad){
  if (!ad) return;
  const temiz = ad.trim();
  if (!temiz) return;
  const varMi = state.malzemeGecmisi.some(x => x.ad.toLowerCase() === temiz.toLowerCase());
  if (!varMi) state.malzemeGecmisi.push({ id: uid(), ad: temiz });
}
function malzemeListesiEkle(){
  state.malzemeGecmisi.unshift({ id: uid(), ad: "" });
  saveData(); render();
}
function malzemeListesiGuncelle(id, deger){
  const m = state.malzemeGecmisi.find(x => x.id === id); if (m) m.ad = deger;
  saveData(); render();
}
function malzemeListesindenSil(id){
  state.malzemeGecmisi = state.malzemeGecmisi.filter(x => x.id !== id);
  saveData(); render();
}
function malzemeListesiGoster(){ ui.view = "malzemeler"; render(); }

/* ---------------- son işlemler ---------------- */
function kaydetIslem(aciklama, hedef){
  if (!state.sonIslemler) state.sonIslemler = [];
  const kullanici = mevcutKullanici ? mevcutKullanici.email : "";
  state.sonIslemler.unshift({ id: uid(), aciklama: kullanici ? `${aciklama} — ${kullanici}` : aciklama, hedef, tarih: bugun(), saat: suAn() });
  if (state.sonIslemler.length > 300) state.sonIslemler.length = 300;
  saveData();
}
function islemeGitById(id){
  const islem = (state.sonIslemler || []).find(x => x.id === id);
  if (!islem || !islem.hedef) return;
  const h = islem.hedef;
  if (h.view === "pompa") pompaSec(h.tesisId, h.makineId, h.pompaId);
  else if (h.view === "satinalma-detay") satinAlmaSec(h.satId);
  else if (h.view === "rapor") raporGoster();
  else if (h.view === "malzemeler") malzemeListesiGoster();
  else if (h.view === "stok") stokGoster();
  else if (h.view === "satinalma") satinAlmaGoster();
}

/* ---------------- stok ---------------- */
function stokGoster(){ ui.view = "stok"; render(); }
function stokDuzenleAcKapat(){ ui.stokDuzenle = !ui.stokDuzenle; render(); }
function stokTesisAcKapat(id){ ui.stokAcikTesis.has(id) ? ui.stokAcikTesis.delete(id) : ui.stokAcikTesis.add(id); render(); }
function stokDepoAcKapat(id){ ui.stokAcikDepo.has(id) ? ui.stokAcikDepo.delete(id) : ui.stokAcikDepo.add(id); render(); }
function depoEkle(tesisId){
  const t = state.tesisler.find(x => x.id === tesisId);
  const yeni = { id: uid(), ad: "Yeni Depo", urunler: [] };
  t.depolar.push(yeni);
  ui.stokAcikDepo.add(yeni.id);
  kaydetIslem(`Yeni depo eklendi: ${yeni.ad} (${t.ad})`, { view: "stok" });
  saveData(); render();
}
function depoSil(tesisId, depoId){
  const t = state.tesisler.find(x => x.id === tesisId);
  t.depolar = t.depolar.filter(d => d.id !== depoId);
  saveData(); render();
}
function depoAdGuncelle(tesisId, depoId, ad){
  const t = state.tesisler.find(x => x.id === tesisId);
  const d = t.depolar.find(x => x.id === depoId); if (d) d.ad = ad;
  saveData(); render();
}
function stokUrunBul(tesisId, depoId, urunId){
  const t = state.tesisler.find(x => x.id === tesisId);
  const d = t?.depolar.find(x => x.id === depoId);
  const u = d?.urunler.find(x => x.id === urunId);
  return { t, d, u };
}
function stokUrunEkle(tesisId, depoId){
  const t = state.tesisler.find(x => x.id === tesisId);
  const d = t.depolar.find(x => x.id === depoId);
  d.urunler.push({ id: uid(), ad: "", miktar: 0, birim: "", kritikTakip: false, kritikEsik: 0 });
  saveData(); render();
}
function stokUrunSil(tesisId, depoId, urunId){
  const t = state.tesisler.find(x => x.id === tesisId);
  const d = t.depolar.find(x => x.id === depoId);
  d.urunler = d.urunler.filter(x => x.id !== urunId);
  saveData(); render();
}
function stokUrunGuncelle(tesisId, depoId, urunId, alan, deger){
  const { u } = stokUrunBul(tesisId, depoId, urunId); if (u) u[alan] = deger;
  if (alan === "ad") malzemeGecmisineEkle(deger);
  saveData(); render();
}
function stokKritikDegistir(tesisId, depoId, urunId){
  const { u } = stokUrunBul(tesisId, depoId, urunId); if (!u) return;
  u.kritikTakip = !u.kritikTakip;
  saveData(); render();
}
function tesisKritikMi(t){
  return (t.depolar || []).some(d => (d.urunler || []).some(u => u.kritikTakip && (parseFloat(u.miktar) || 0) <= (parseFloat(u.kritikEsik) || 0)));
}
function kritikTesisAdlari(){
  return state.tesisler.filter(tesisKritikMi).map(t => t.ad);
}
function urunKritikMi(ad){
  if (!ad) return false;
  const q = ad.trim().toLowerCase();
  if (!q) return false;
  return state.tesisler.some(t => (t.depolar || []).some(d => (d.urunler || []).some(u =>
    u.ad.trim().toLowerCase() === q && u.kritikTakip && (parseFloat(u.miktar) || 0) <= (parseFloat(u.kritikEsik) || 0)
  )));
}

/* ---------------- satın almadan stoğa bekleyen ürünler ---------------- */
function bekleyenStokKalemleri(tesisAdi){
  const sonuc = [];
  state.satinAlmalar.forEach(sat => {
    if (!(sat.yerler || []).some(y => y.ad === tesisAdi)) return;
    (sat.kalemler || []).forEach(k => {
      if (!k.stokaAktarildi && k.durum === "Geldi" && k.urun && k.urun.trim()) {
        sonuc.push({ satId: sat.id, kalemId: k.id, urun: k.urun, miktar: k.miktar, birim: k.birim });
      }
    });
  });
  return sonuc;
}

function stokBekleyenAlanGuncelle(satId, kalemId, alan, deger){
  const sat = satinAlmaBul(satId); const k = sat?.kalemler.find(x => x.id === kalemId); if (k) k[alan] = deger;
  if (alan === "urun") malzemeGecmisineEkle(deger);

}
function stokBekleyenOnayla(tesisId){
  const t = state.tesisler.find(x => x.id === tesisId);
  const secilenler = ui.stokBekleyenSecim[tesisId];
  if (!secilenler || secilenler.size === 0) { ui.mesaj = "Lütfen stoğa eklenecek en az bir ürün seçin."; render(); return; }
  teyitIste("Stok Onayı", "Seçilen ürünleri stoğa eklemek üzeresiniz. Onaylamak için işlemi çözün:", () => stokBekleyenIsle(tesisId));
}
function stokBekleyenIsle(tesisId){
  const t = state.tesisler.find(x => x.id === tesisId);
  const secilenler = ui.stokBekleyenSecim[tesisId] || new Set();
  let depoId = ui.stokBekleyenDepo[tesisId];
  let depo = t.depolar.find(d => d.id === depoId);
  if (!depo) {
    depo = t.depolar.find(d => d.ad === "Genel Depo");
    if (!depo) { depo = { id: uid(), ad: "Genel Depo", urunler: [] }; t.depolar.push(depo); }
  }
  const bekleyenler = bekleyenStokKalemleri(t.ad);
  let sayac = 0;
  bekleyenler.forEach(b => {
    const anahtar = b.satId + "|" + b.kalemId;
    malzemeGecmisineEkle(b.urun);
    if (!secilenler.has(anahtar)) return;
    const sat = satinAlmaBul(b.satId); const k = sat?.kalemler.find(x => x.id === b.kalemId);
    if (!k) return;
    const adTemiz = (k.urun || "").trim();
    const mevcut = depo.urunler.find(u => u.ad.trim().toLowerCase() === adTemiz.toLowerCase());
    const miktar = parseFloat(k.miktar) || 0;
    if (mevcut) { mevcut.miktar = (parseFloat(mevcut.miktar) || 0) + miktar; }
    else { depo.urunler.push({ id: uid(), ad: adTemiz, miktar, birim: k.birim || "", kritikTakip: false, kritikEsik: 0 }); }
    k.stokaAktarildi = true;
    sayac++;
  });
  delete ui.stokBekleyenSecim[tesisId];
  kaydetIslem(`Stok onaylandı: ${sayac} ürün → ${t.ad} / ${depo.ad}`, { view: "stok" });
  ui.mesaj = `${sayac} ürün ${t.ad} / ${depo.ad} stoğuna eklendi.`;
  saveData(); render();
}

function saKalemEkle(satId){
  const s = satinAlmaBul(satId); s.kalemler.push(bosKalem()); saveData(); render();
}
function saKalemSil(satId, kalemId){
  const s = satinAlmaBul(satId); s.kalemler = s.kalemler.filter(x => x.id !== kalemId);
  if (s.kalemler.length === 0) s.kalemler.push(bosKalem());
  saveData(); render();
}
function saKalemGuncelle(satId, kalemId, alan, deger){
  const s = satinAlmaBul(satId); const k = s.kalemler.find(x => x.id === kalemId); if (k) k[alan] = deger;
  if (alan === "urun") malzemeGecmisineEkle(deger);
  saveData(); render();
}
function saKalemDurumDegistir(satId, kalemId){
  const s = satinAlmaBul(satId); const k = s.kalemler.find(x => x.id === kalemId); if (!k) return;
  if (k.stokaAktarildi) { ui.mesaj = "Bu ürün zaten stoğa eklendi, durumu değiştirilemez."; render(); return; }
  k.durum = k.durum === "Geldi" ? "Gelmedi" : "Geldi";
  saveData(); render();
}
/* kullanıldığı yer satırları */
function saYerEkle(satId){
  const s = satinAlmaBul(satId); s.yerler.push(bosYer()); saveData(); render();
}
function saYerSil(satId, yerId){
  const s = satinAlmaBul(satId); s.yerler = s.yerler.filter(x => x.id !== yerId);
  if (s.yerler.length === 0) s.yerler.push(bosYer());
  saveData(); render();
}
function saYerGuncelle(satId, yerId, deger){
  const s = satinAlmaBul(satId); const y = s.yerler.find(x => x.id === yerId); if (y) y.ad = deger;
  saveData(); render();
}

function saTumKalemler(){
  return state.satinAlmalar.flatMap(s => s.kalemler.map(k => ({ ...k, satId: s.id })));
}
function saDurumFiltreDegistir(f){ ui.saFiltre = f; render(); }
function saFiltreliListe(){
  const q = (ui.saArama || "").trim().toLowerCase();
  let liste = state.satinAlmalar;
  if (q) {
    liste = liste.filter(s =>
      [s.siparisNo, s.firma,
       ...(s.kalemler || []).map(k => k.urun),
       ...(s.yerler || []).map(y => y.ad)]
        .some(alan => (alan || "").toLowerCase().includes(q))
    );
  }
  if (ui.saFiltre === "gelen") {
    liste = liste.filter(s => s.kalemler.length > 0 && s.kalemler.every(k => k.durum === "Geldi"));
  } else if (ui.saFiltre === "gelmeyen") {
    liste = liste.filter(s => s.kalemler.some(k => k.durum === "Gelmedi"));
  }
  return liste;
}
function saListesiRender(){
  const kap = document.getElementById("saListesiKapsayici");
  if (!kap) return;
  const liste = saFiltreliListe();
  let h = `<div class="tabloSarici">`;
  if (liste.length === 0) {
    h += `<div class="bosMetin" style="padding:16px">${state.satinAlmalar.length===0 ? "Henüz satın alma kaydı yok. \"+ satın alma ekle\" ile başlayın." : "Aramanla eşleşen bir kayıt bulunamadı."}</div>`;
  } else {
    liste.forEach(sat => {
      const urunler = (sat.kalemler || []).map(k => k.urun).filter(Boolean);
      const gelenSayi = (sat.kalemler || []).filter(k => k.durum === "Geldi").length;
      const toplam = (sat.kalemler || []).length;
      const yerMetni = (sat.yerler || []).map(y => y.ad).filter(Boolean).join(", ");
      const renk = gelenSayi === toplam ? durumRenk.Geldi : durumRenk.Gelmedi;
      const renkRgb = gelenSayi === toplam ? durumRenkRgb.Geldi : durumRenkRgb.Gelmedi;
      h += `<div class="saListeSatir ty-satir" onclick="satinAlmaSec('${sat.id}')">
        <div style="flex:1;min-width:0">
          <div class="saListeUrun">${esc(urunler.slice(0,3).join(", ")) || "(ürün adı girilmedi)"}${urunler.length>3?` <span style="color:var(--yazi-soluk)">+${urunler.length-3} diğer</span>`:''}</div>
          <div class="saListeAltBilgi">${[sat.siparisNo && ('Sipariş No: '+sat.siparisNo), yerMetni].filter(Boolean).map(esc).join(' · ') || '—'}</div>
        </div>
        <span class="rozetDurum" style="color:${renk};border-color:rgba(${renkRgb},0.33);background:rgba(${renkRgb},0.1)">${gelenSayi}/${toplam} geldi</span>
      </div>`;
    });
  }
  h += `</div>`;
  kap.innerHTML = h;
}

/* ---------------- yedekleme ---------------- */
function disaAktar(){
  const veri = { ...state, olusturma: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(veri, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `tesis-yedek-${bugun().replaceAll(".", "-")}.json`; a.click();
  URL.revokeObjectURL(url);
}
function iceAktar(dosya){
  if (!dosya) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const veri = JSON.parse(reader.result);
      if (veri.tesisler) state.tesisler = veri.tesisler;
      if (veri.satinAlmalar) state.satinAlmalar = veri.satinAlmalar;
      ui.mesaj = "Yedek başarıyla geri yüklendi.";
      saveData(); render();
    } catch(e){ ui.mesaj = "Yedek dosyası okunamadı. Geçerli bir JSON dosyası seçin."; render(); }
  };
  reader.readAsText(dosya);
}

function duzenlemeBaslat(id){ ui.duzenlenenId = id; render(); }
function duzenlemeIptal(){ ui.duzenlenenId = null; render(); }
function tesisAdKaydet(inputEl, tesisId){
  const t = state.tesisler.find(x => x.id === tesisId);
  if (t && inputEl.value.trim()) t.ad = inputEl.value.trim();
  ui.duzenlenenId = null; saveData(); render();
}
function makineAdKaydet(inputEl, tesisId, makineId){
  const t = state.tesisler.find(x => x.id === tesisId);
  const m = t.makineler.find(x => x.id === makineId);
  if (m && inputEl.value.trim()) m.ad = inputEl.value.trim();
  ui.duzenlenenId = null; saveData(); render();
}
function pompaAdKaydetSol(inputEl, tesisId, makineId, pompaId){
  const t = state.tesisler.find(x => x.id === tesisId);
  const m = t.makineler.find(x => x.id === makineId);
  const p = m.pompalar.find(x => x.id === pompaId);
  if (p && inputEl.value.trim()) p.ad = inputEl.value.trim();
  ui.duzenlenenId = null; saveData(); render();
}
function enterIleKaydet(e){ if (e.key === "Enter") e.target.blur(); if (e.key === "Escape") { ui.duzenlenenId = null; render(); } }

    </div>`;

    h += `<div class="kart">
      <div class="kartBaslikSatir"><span class="kartBaslik">Kullanılan malzemeler</span><button class="ekleMini ty-btn" onclick="raporMalzemeEkle()">+ malzeme ekle</button></div>`;
    raporForm.malzemeler.forEach(x => {
      h += `<div class="parcaSatir">
        <input class="parcaGirdi" list="malzemeListesi" placeholder="Malzeme adı (örn: 6305 rulman)" value="${esc(x.ad)}" onchange="raporMalzemeGuncelle('${x.id}','ad',this.value)" />
        <input class="parcaGirdi" style="width:70px;flex:none" type="number" placeholder="Adet" value="${esc(x.adet)}" onchange="raporMalzemeGuncelle('${x.id}','adet',this.value)" />
        <span class="silIkon" onclick="silOnayla('Malzemeyi Sil', ()=>raporMalzemeSil('${x.id}'))">×</span>
      </div>`;
    });
    h += `<div class="bosMetin" style="margin-top:8px">Yazmaya başladığında daha önce kullanılmış malzemeler öneri olarak çıkar.</div>`;
    h += `</div>`;

    h += `<button class="eklePrimer ty-btn" style="padding:10px 20px;font-size:13.5px" onclick="raporKaydet()">Raporu kaydet</button>`;

    el.innerHTML = h;
    return;
  }

  if (ui.view === "satinalma") {
    let h = `<div class="saUstSatir">
      <div><div class="pompaAdBaslik">Satın Almalar</div><div class="altBaslik2">satınalma talep formu formatında kayıt ve takip</div></div>
      <div style="display:flex;gap:8px;">
        <button class="eklePrimer ty-btn" onclick="satinAlmaEkle()">+ satın alma ekle</button>
      </div>
    </div>`;
    if (ui.mesaj) { h += `<div class="bilgiKutu">${esc(ui.mesaj)}</div>`; }
    h += `<input class="girdi saArama" id="saArama" placeholder="🔍  Ürün, sipariş no, tesis, firma... ara" value="${esc(ui.saArama)}" oninput="saAramaGuncelle(this.value)" />`;
    const tumSayi = state.satinAlmalar.length;
    const gelenSayi = state.satinAlmalar.filter(s => s.kalemler.length>0 && s.kalemler.every(k=>k.durum==='Geldi')).length;
    const gelmeyenSayi = state.satinAlmalar.filter(s => s.kalemler.some(k=>k.durum==='Gelmedi')).length;
    h += `<div class="filtreSatiri">
      <button class="filtreBtn ${ui.saFiltre==='tumu'?'filtreBtnAktif':''} ty-btn" style="--filtre-renk:var(--vurgu);--filtre-bg:rgba(var(--vurgu-rgb),0.12)" onclick="saDurumFiltreDegistir('tumu')">Tümü <span class="filtreSayi">${tumSayi}</span></button>
      <button class="filtreBtn ${ui.saFiltre==='gelen'?'filtreBtnAktif':''} ty-btn" style="--filtre-renk:${durumRenk.Geldi};--filtre-bg:rgba(${durumRenkRgb.Geldi},0.12)" onclick="saDurumFiltreDegistir('gelen')">Gelenler <span class="filtreSayi">${gelenSayi}</span></button>
      <button class="filtreBtn ${ui.saFiltre==='gelmeyen'?'filtreBtnAktif':''} ty-btn" style="--filtre-renk:${durumRenk.Gelmedi};--filtre-bg:rgba(${durumRenkRgb.Gelmedi},0.12)" onclick="saDurumFiltreDegistir('gelmeyen')">Gelmeyenler <span class="filtreSayi">${gelmeyenSayi}</span></button>
    </div>`;
    h += `<div id="saListesiKapsayici"></div>`;
    el.innerHTML = h;
    saListesiRender();
    return;
  }

  if (ui.view === "satinalma-detay") {
    const sat = state.satinAlmalar.find(x => x.id === ui.saSecim);
    if (!sat) { ui.view = "satinalma"; renderAna(); return; }
    const baslikAlan = (etiket, key, genislik) => `
      <div style="${genislik?`width:${genislik}px`:'flex:1'}">
        <div class="bosMetin" style="margin-bottom:5px;font-style:normal">${etiket}</div>
        ${ui.saDuzenle
          ? `<input class="girdi" value="${esc(sat[key])}" onchange="satinAlmaGuncelle('${sat.id}','${key}',this.value)" />`
          : `<div class="deger">${esc(sat[key]) || '—'}</div>`}
      </div>`;

    let h = `<div class="geriDon ty-btn" onclick="satinAlmaGoster()"><span style="font-size:17px;line-height:1">‹</span> Satın Almalar listesine dön</div>`;
    if (ui.mesaj) { h += `<div class="bilgiKutu">${esc(ui.mesaj)}</div>`; ui.mesaj = ""; }
    h += `<div class="pompaBaslikSatir">
      <div class="pompaAdBaslik">${esc(sat.siparisNo) ? ('Sipariş No: ' + esc(sat.siparisNo)) : 'İsimsiz Satınalma Talebi'}</div>
      <div style="display:flex;gap:8px">
        <button class="${ui.saDuzenle?'duzenleBtnAktif':'duzenleBtn'} ty-btn" onclick="satinAlmaDuzenleAcKapat()">${ui.saDuzenle?'Düzenlemeyi bitir':'Düzenle'}</button>
        ${adminMi() ? `<button class="ustBtn ty-btn" style="color:var(--kirmizi)" onclick="silOnayla('Satın Alma Talebini Sil', ()=>satinAlmaSil('${sat.id}'))">Sil</button>` : ''}
      </div>
    </div>`;

    h += `<div class="kart">
      <div class="kartBaslik" style="margin-bottom:12px">Satınalma Talep Formu</div>
      <div style="display:flex;gap:14px;margin-bottom:14px">
        ${baslikAlan('Geliş Tarihi', 'gelisTarihi', 140)}
        ${baslikAlan('Satınalma (Sipariş) No', 'siparisNo')}
      </div>
    </div>`;

    h += `<div class="kart">
      <div class="kartBaslikSatir">
        <span class="kartBaslik">Malzemenin Cinsi ve Özellikleri (Ürün)</span>
        ${ui.saDuzenle?`<button class="ekleMini ty-btn" onclick="saKalemEkle('${sat.id}')">+ satır ekle</button>`:''}
      </div>
      <div class="kalemBaslikSatir">
        <span style="width:26px"></span><span style="flex:2">Ürün</span><span style="flex:1">Miktar</span><span style="flex:1">Birim</span><span style="width:120px">Teslim Tarihi</span><span style="width:90px">Durum</span><span style="width:20px"></span>
      </div>
      ${sat.kalemler.map((k, i) => `
        <div class="kalemSatir">
          <span class="kalemNo">${i+1}</span>
          ${urunKritikMi(k.urun) ? `<span class="kritikSolukNokta" title="Bu ürün kritik stokta">●</span>` : ''}
          ${ui.saDuzenle ? `
            <input class="parcaGirdi" style="flex:2" list="malzemeListesi" placeholder="Ürün adı" value="${esc(k.urun)}" onchange="saKalemGuncelle('${sat.id}','${k.id}','urun',this.value)" />
            <input class="parcaGirdi" style="flex:1" placeholder="Miktar" value="${esc(k.miktar)}" onchange="saKalemGuncelle('${sat.id}','${k.id}','miktar',this.value)" />
            <input class="parcaGirdi" style="flex:1" placeholder="Birim" value="${esc(k.birim)}" onchange="saKalemGuncelle('${sat.id}','${k.id}','birim',this.value)" />
            <input class="parcaGirdi" style="width:120px;flex:none" placeholder="gg.aa.yyyy" value="${esc(k.teslimTarihi)}" onchange="saKalemGuncelle('${sat.id}','${k.id}','teslimTarihi',this.value)" />
          ` : `
            <span style="flex:2;color:var(--yazi)">${esc(k.urun) || '—'}</span>
            <span style="flex:1;color:var(--yazi-dim)">${esc(k.miktar) || '—'}</span>
            <span style="flex:1;color:var(--yazi-dim)">${esc(k.birim) || '—'}</span>
            <span style="width:120px;color:var(--yazi-dim);font-family:'IBM Plex Mono',monospace">${esc(k.teslimTarihi) || '—'}</span>
          `}
          <button class="ty-btn" style="width:90px;flex:none;background:rgba(${durumRenkRgb[k.durum]},0.1);color:${durumRenk[k.durum]};font-weight:600;border:1px solid rgba(${durumRenkRgb[k.durum]},0.33);border-radius:6px;padding:6px 0;font-size:11.5px;${k.stokaAktarildi?'cursor:not-allowed;opacity:0.6':''}" title="${k.stokaAktarildi?'Bu ürün stoğa eklendi, durum kilitli':''}" onclick="saKalemDurumDegistir('${sat.id}','${k.id}')">${k.durum}${k.stokaAktarildi?' 🔒':''}</button>
          ${ui.saDuzenle ? `<span class="silIkon" style="width:20px" onclick="silOnayla('Ürünü Sil', ()=>saKalemSil('${sat.id}','${k.id}'))">×</span>` : `<span style="width:20px"></span>`}
        </div>`).join('')}
    </div>`;

    h += `<div class="kart">
      <div class="kartBaslikSatir">
        <span class="kartBaslik">Kullanıldığı Yer</span>
        ${ui.saDuzenle?`<button class="ekleMini ty-btn" onclick="saYerEkle('${sat.id}')">+ satır ekle</button>`:''}
      </div>
      ${sat.yerler.map((y, i) => `
        <div class="kalemSatir">
          <span class="kalemNo">${i+1}</span>
          ${ui.saDuzenle
            ? `<select class="parcaGirdi" style="flex:1" onchange="saYerGuncelle('${sat.id}','${y.id}',this.value)">
                 <option value="">— tesis seç —</option>
                 ${gorunurTesisler().map(t => `<option value="${esc(t.ad)}" ${t.ad===y.ad?'selected':''}>${esc(t.ad)}</option>`).join('')}
               </select>
               <span class="silIkon" style="width:20px" onclick="silOnayla('Satırı Sil', ()=>saYerSil('${sat.id}','${y.id}'))">×</span>`
            : `<span style="flex:1;color:var(--yazi-ikincil)">${esc(y.ad) || '—'}</span>`}
        </div>`).join('')}
    </div>`;

    h += `<div class="kart">
      <div class="kartBaslik" style="margin-bottom:12px">Sipariş Bilgileri</div>
      <div>${baslikAlan('Sipariş Edilmesi İstenen Firma / Firmalar', 'firma')}</div>
    </div>`;

    h += `<div class="bosMetin">Kayıt zamanı: ${esc(sat.eklenmeTarihi)} ${esc(sat.eklenmeSaati)}</div>`;

    el.innerHTML = h;
  }
}
</script>
</body>
</html>
